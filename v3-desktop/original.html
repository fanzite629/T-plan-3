<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T计划</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap">
<style>
/* Layout: 左侧"任务侧栏" + 右侧单焦点主区。首页以一个输入框为中心；计时是主角；其余页面是窄栏工作区。 */
:root{
 --bg:#FAF9F5;--side:#F3F1EA;--panel:#FFFFFF;--soft:#ECE9E0;--line:#E2DED3;
 --text:#1F1E1D;--t2:#5B5953;--t3:#75736C;
 --accent:#D97757;--accent-ink:#AF4F2C;--accent-soft:#F7E6DC;--btn:#BF5D39;--on-btn:#FFFFFF;
 --ok:#4F7A43;--ok-soft:#E2EBDB;--warn:#94600F;--warn-soft:#F5EAD2;--bad:#B3412E;--bad-soft:#F6DFD9;
 --c-school:#C96442;--c-math:#5878A3;--c-english:#668A55;--c-other:#A9853A;--c-legacy:#8E8A80;
 --scrim:rgba(31,30,29,.32);--shadow:0 2px 14px rgba(60,45,30,.07);--pop-shadow:0 10px 30px rgba(60,45,30,.16);
 --serif:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
 --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
 --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#262624;--side:#1F1E1D;--panel:#30302E;--soft:#3A3A37;--line:#46453F;--text:#ECEAE3;--t2:#BCBAB2;--t3:#9C9A91;
 --accent:#D97757;--accent-ink:#EB9A78;--accent-soft:#4A3229;--btn:#C2603B;--on-btn:#FFFFFF;
 --ok:#97BA86;--ok-soft:#2E3A2A;--warn:#E2B263;--warn-soft:#3F3524;--bad:#E8806C;--bad-soft:#4A2B25;
 --c-school:#DE8762;--c-math:#8CA8CC;--c-english:#9BBC86;--c-other:#D2AC5E;--c-legacy:#A29E93;
 --scrim:rgba(0,0,0,.5);--shadow:0 2px 14px rgba(0,0,0,.28);--pop-shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#262624;--side:#1F1E1D;--panel:#30302E;--soft:#3A3A37;--line:#46453F;--text:#ECEAE3;--t2:#BCBAB2;--t3:#9C9A91;
 --accent:#D97757;--accent-ink:#EB9A78;--accent-soft:#4A3229;--btn:#C2603B;--on-btn:#FFFFFF;
 --ok:#97BA86;--ok-soft:#2E3A2A;--warn:#E2B263;--warn-soft:#3F3524;--bad:#E8806C;--bad-soft:#4A2B25;
 --c-school:#DE8762;--c-math:#8CA8CC;--c-english:#9BBC86;--c-other:#D2AC5E;--c-legacy:#A29E93;
 --scrim:rgba(0,0,0,.5);--shadow:0 2px 14px rgba(0,0,0,.28);--pop-shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:500;text-wrap:balance;margin:0}
.num,.tab{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
aside{background:var(--side);border-right:1px solid var(--line);padding:12px 10px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.brandrow{display:flex;align-items:center;gap:6px;padding:0 4px 10px}
.brand{font:500 21px/1 var(--serif);letter-spacing:.02em}
.brand b{color:var(--accent);font-weight:600}
.grow{flex:1}
.ib{width:34px;height:34px;border:0;border-radius:9px;background:none;display:grid;place-items:center;color:var(--t2)}
.ib:hover{background:var(--soft)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:9px;background:none;color:var(--text);text-align:left}
.nav svg{color:var(--t2)}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--soft);font-weight:600}
.nav .k{margin-left:auto;font-size:12px;color:var(--t3)}
.lbl{font-size:12.5px;color:var(--t3);padding:16px 10px 4px;display:flex;justify-content:space-between;letter-spacing:.04em}
.grp{min-height:24px;border-radius:9px}
.grp.over{background:var(--accent-soft)}
.item{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 10px;border-radius:9px;cursor:pointer;user-select:none}
.item:hover{background:var(--soft)}
.item.drag{opacity:.4}
.item.over{box-shadow:0 -2px 0 var(--accent)}
.item.over-after{box-shadow:0 2px 0 var(--accent)}
.item{position:relative}
.grip{position:absolute;left:-2px;top:50%;transform:translateY(-50%);opacity:0;color:var(--t3);cursor:grab;font-size:11px;letter-spacing:-2px;user-select:none}
.item:hover .grip,.item:focus .grip{opacity:1}
.dot{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--t3);flex:none;display:grid;place-items:center;font-size:10px;color:var(--on-btn);background:none;padding:0}
.dot.chk{border-radius:4px;transform:rotate(45deg) scale(.82)}
.dot.chk span{transform:rotate(-45deg)}
.item.done .dot{background:var(--ok);border-color:var(--ok)}
.item.done .nm{color:var(--t3);text-decoration:line-through}
.nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mt{font-size:12px;color:var(--t3)}
.tag{font-size:11px;line-height:18px;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:0 6px;flex:none}
.tag.late{color:var(--bad);background:var(--bad-soft)}
.pin{opacity:0;border:0;background:none;color:var(--t3);padding:0 2px;line-height:0}
.pin svg{width:14px;height:14px}
.item:hover .pin,.item:focus-within .pin{opacity:1}
.item.pinned .pin{opacity:1;color:var(--accent)}
.item.pinned .pin svg{fill:currentColor}
.empty{color:var(--t3);padding:6px 10px;font-size:13px}
.sidefoot{margin-top:auto;padding:14px 6px 2px;display:flex;flex-direction:column;gap:4px}
.linkbtn{border:0;background:none;color:var(--t2);padding:6px 4px;text-align:left;border-radius:8px}
.linkbtn:hover{color:var(--text);background:var(--soft)}
.tpill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;color:var(--text)}
.tpill i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.tpill.due i{background:var(--bad)}
.tpill.paused i{background:var(--t3)}

.mainwrap{position:relative;min-width:0;display:flex;flex-direction:column;min-height:0}
.mtop{display:none}
main{flex:1;overflow:auto;padding-block:0 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center}
#sbOpen{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));z-index:6}
body.c .app{grid-template-columns:minmax(0,1fr)}
body.c aside{display:none}
.scrim{display:none}

/* ---------- shared ---------- */
.page{width:100%;max-width:760px;margin-top:7vh;display:flex;flex-direction:column;gap:18px}
.page.wide{max-width:1100px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:28px}
.ph p{margin:4px 0 0;color:var(--t2)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 16px;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.pri:hover{opacity:.9}
.btn.acc{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h2{font-size:18px}
.sub{color:var(--t2);font-size:13px}
.note-s{color:var(--t3);font-size:12.5px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:2px;flex:none}
.seg button{border:0;background:none;padding:4px 13px;border-radius:8px;color:var(--t2)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:12.5px;line-height:24px;color:var(--t2);background:var(--panel);display:inline-flex;align-items:center;gap:4px}
button.chip:hover{background:var(--soft)}
.chip.hit{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip .x{margin-left:2px;cursor:pointer;opacity:.7;border:0;background:none;padding:0 2px;color:inherit;font:inherit}
.chip .x:hover{opacity:1}
.cd{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--t2);min-width:0}
input.in,select.in,textarea.in{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%;color:var(--text)}
textarea.in{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.banner{width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13.5px}
.banner b{color:var(--warn)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:50;font-size:13.5px;max-width:min(560px,90vw);box-shadow:var(--pop-shadow)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--text);padding:20px 22px;width:min(520px,94vw);max-height:88vh;overflow:auto;box-shadow:var(--pop-shadow)}
dialog::backdrop{background:var(--scrim)}
dialog h2{font-size:20px;margin-bottom:12px}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:8px 12px;font-size:13.5px}

/* ---------- home ---------- */
.hshell{width:100%;max-width:1200px;flex:1 0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:0 28px;justify-items:center;align-items:center;align-content:center;padding-block:5vh 3vh}
.hshell>.home{justify-self:center}
.tpanel{width:100%;max-width:760px;margin:28px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ptab{position:absolute;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;display:inline-flex;gap:8px;align-items:center;color:var(--t2);font-size:13px}
.ptab:hover{background:var(--soft)}
.tph{display:flex;justify-content:space-between;align-items:flex-start}
.tph b{font:500 17px var(--serif);display:block}
.tph small{color:var(--t3);font-size:12.5px}
.tph .ib{width:28px;height:28px;font-size:18px}
.plive{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--side);border-radius:10px;padding:6px 10px;color:var(--text);text-align:left;min-width:0}
.plive .clk{font:500 14px var(--mono)}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstats div{display:flex;flex-direction:column}
.pstats strong{font:500 21px/1.2 var(--serif)}
.pstats small{color:var(--t3);font-size:12px}
.pbar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:-4px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.psec{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.pl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--t3);letter-spacing:.03em}
.pl .linkbtn{font-size:12.5px;color:var(--accent-ink)}
.psec .strip{height:26px;margin:2px 0 0}
.psec .ticks{font-size:10px}
.pweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:74px}
.pweek div{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pweek .pb{flex:1;width:100%;max-width:22px;background:var(--soft);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.pweek .pb i{display:block;width:100%;background:var(--accent);border-radius:4px}
.pweek .pb i.t{background:var(--accent-ink)}
.pweek small{font-size:11px;color:var(--t3)}
.pweek small.on{color:var(--accent-ink);font-weight:600}
.pcourse{display:flex;gap:8px;align-items:baseline;border:0;background:none;padding:4px 6px;margin:0 -6px;border-radius:8px;text-align:left;color:var(--text);min-width:0}
.pcourse:hover{background:var(--soft)}
.pcourse small{color:var(--t3);flex:none;width:44px}
@media (min-width:1240px){
 .hshell{grid-template-columns:minmax(0,1fr) 300px;align-items:start}
 .hshell.off{grid-template-columns:minmax(0,1fr)}
 .tpanel{position:sticky;top:20px;margin-top:0;max-width:none;align-self:start}
 .hshell>.home{max-width:720px}
}
.home{width:100%;max-width:760px;display:flex;flex-direction:column;gap:0}
.home>.banner{margin:0 0 30px}
.hello{display:flex;align-items:center;justify-content:center;gap:12px;font:400 34px/1.3 var(--serif);margin-bottom:24px;text-align:center}
.logo{display:inline-grid;place-items:center;flex:none;width:46px;height:46px;border-radius:13px;background:var(--btn);color:var(--on-btn);font:600 30px/1 var(--serif);letter-spacing:0}
.logo.sm{width:26px;height:26px;border-radius:7px;font-size:17px}
.box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 14px 10px 20px;box-shadow:var(--shadow)}
.box:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.box textarea{width:100%;border:0;outline:0;resize:none;background:none;font-size:16px;min-height:48px;line-height:1.6;padding:2px 0}
.box textarea::placeholder{color:var(--t3)}
.parsed{display:flex;gap:6px;flex-wrap:wrap;min-height:4px;margin:2px 0 6px}
.bar{display:flex;align-items:center;gap:8px}
.sq{width:34px;height:34px;border:0;border-radius:9px;background:none;font-size:22px;line-height:1;color:var(--t2)}
.sq:hover{background:var(--soft)}
.send{width:34px;height:34px;border-radius:10px;border:0;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;flex:none}
.model{margin-left:auto;border:0;background:none;padding:5px 10px;border-radius:9px;color:var(--t2);font-size:13.5px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model:hover{background:var(--soft);color:var(--text)}
.agentc{flex-direction:column;border-color:var(--accent)}
.agl{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.agp{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.agp legend{font-size:13px;color:var(--t2);padding:0 4px}
.send:disabled{opacity:.35;cursor:default}
.feed{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;color:var(--t2);display:flex;gap:10px;align-items:baseline}
.act span{flex:1;min-width:0}
.act b{color:var(--ok);font-weight:500}
.pop{position:fixed;z-index:40;min-width:270px;max-width:min(340px,92vw);max-height:min(70vh,560px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--pop-shadow)}
.pop button.r{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;text-align:left;color:var(--text);line-height:1.35}
.pop button.r:hover{background:var(--soft)}
.pop button.r small{display:block;color:var(--t3);font-size:12px}
.pop button.r svg{color:var(--t2)}
.pop .ch{margin-left:auto;color:var(--t3)}
.pop .ck{margin-left:auto;color:var(--accent-ink)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.gh{font-size:12px;color:var(--t3);padding:8px 10px 2px;letter-spacing:.04em}
.opts{display:flex;gap:6px;flex-wrap:wrap;padding:4px 10px 8px}
.opts button{padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font-size:13px}
.opts button.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.opts input{padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);width:auto;font-size:13px}

/* ---------- timer ---------- */
.tgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.dial{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 18px}
.dial .what{font:500 19px/1.4 var(--serif);text-align:center;min-height:27px;max-width:100%;overflow-wrap:anywhere}
.ring{position:relative;width:min(270px,70vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--soft);stroke-width:9}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring.due .arc{stroke:var(--bad)}
.ring.paused .arc{stroke:var(--t3)}
.ring .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.clock{font:400 54px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cap{font-size:13px;color:var(--t2);text-align:center;padding:0 24px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.side h2{margin-bottom:10px}
.form{display:flex;flex-direction:column;gap:12px}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchips .chip{cursor:pointer}
.durs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.durs button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 12px;color:var(--text)}
.durs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.durs input{width:84px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--t3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--text)}
.check input{margin-top:4px}
.strip{position:relative;height:34px;border-radius:8px;background:var(--soft);overflow:hidden;margin:6px 0 2px}
.strip .blk{position:absolute;top:5px;bottom:5px;border-radius:4px;min-width:3px;opacity:.9}
.strip .now{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.55}
.ticks{position:relative;height:16px;font-size:11px;color:var(--t3)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.slist{display:flex;flex-direction:column}
.sr{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 12px;padding:9px 2px;border-top:1px solid var(--line);align-items:baseline}
.sr:first-child{border-top:0}
.sr .tm{font:13px var(--mono);color:var(--t2);font-variant-numeric:tabular-nums}
.sr .tt{display:flex;gap:8px;align-items:baseline;min-width:0}
.sr .tt span{overflow-wrap:anywhere}
.sr .mn{font-variant-numeric:tabular-nums;color:var(--t2);font-size:13.5px;display:flex;gap:6px;align-items:center}
.sr .nt{grid-column:2/4;color:var(--t2);font-size:13px;margin-top:-2px;overflow-wrap:anywhere}
.sr.note .tt span{color:var(--t2)}
.sr .eb{border:0;background:none;color:var(--t3);padding:0 4px;font-size:13px}
.sr .eb:hover{color:var(--text)}

/* ---------- review ---------- */
.stats{display:flex;gap:10px 26px;flex-wrap:wrap;align-items:baseline}
.stats div{display:flex;flex-direction:column}
.stats strong{font:500 26px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.stats small{color:var(--t3);font-size:12.5px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--t3);font-size:11px;font-family:var(--sans)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.z{fill:var(--soft)}
.chart .bar.t{fill:var(--accent-ink)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px;margin-top:8px}
.hbar .tr{grid-column:1/3;height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-bottom:6px}
.hbar .tr i{display:block;height:100%;border-radius:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:8px}
.heat .hd{font-size:11px;color:var(--t3);text-align:center}
.heat button{aspect-ratio:1.6;border-radius:6px;border:0;background:var(--soft);font-size:11px;color:var(--t2);padding:0;max-width:100%}
.heat button.l1{background:color-mix(in srgb,var(--accent) 22%,var(--soft))}
.heat button.l2{background:color-mix(in srgb,var(--accent) 48%,var(--soft))}
.heat button.l3{background:color-mix(in srgb,var(--accent) 75%,var(--soft));color:var(--on-btn)}
.heat button.l4{background:var(--btn);color:var(--on-btn)}
.heat button.nil{visibility:hidden}
.day{border-top:1px solid var(--line);padding-top:4px}
.day summary{cursor:pointer;padding:8px 0;display:flex;gap:10px;align-items:baseline;list-style:none}
.day summary::-webkit-details-marker{display:none}
.day summary b{font-weight:600}
.day summary::before{content:"›";color:var(--t3);display:inline-block;transition:transform .15s}
.day[open] summary::before{transform:rotate(90deg)}

/* ---------- week ---------- */
.wk{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.wcol{border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:6px;min-height:280px;background:var(--side);border:1px solid var(--line);min-width:0}
.wcol.over{background:var(--accent-soft)}
.wcol.td{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.wh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.wh b{font-weight:600}
.wcol.td .wh b{color:var(--accent-ink)}
.wh small{color:var(--t3)}
.ld{height:4px;border-radius:2px;background:var(--soft);margin:0 4px}
.ld i{display:block;height:100%;border-radius:2px;background:var(--ok)}
.ld i.ov{background:var(--bad)}
.wmeta{display:flex;justify-content:space-between;gap:4px;padding:0 4px;font-size:11.5px;color:var(--t3);flex-wrap:wrap}
.wc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c-other);border-radius:9px;padding:6px 9px;cursor:pointer;display:flex;flex-direction:column;font-size:13.5px;line-height:1.4;text-align:left;color:var(--text);width:100%}
.wc small{color:var(--t3)}
.wc.done{opacity:.55}
.wc.done span{text-decoration:line-through}
.wc.drag{opacity:.35}
.wadd{border:1px dashed var(--line);background:none;border-radius:9px;color:var(--t3);padding:4px;font-size:13px}
.wadd:hover{color:var(--text);border-color:var(--t3)}
.wcol input{font-size:13px;padding:5px 8px}

/* ---------- tree ---------- */
.trees{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tlay{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.ted .grid2{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.tedrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
@media (max-width:760px){.tedrow{grid-template-columns:minmax(0,1fr)}}
.tw{position:relative;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--side);min-height:240px;max-height:70vh}
.tcan{position:relative}
.tcan svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tn{position:absolute;width:176px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.4;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:2px}
.tn b{font-weight:500;overflow-wrap:anywhere}
.tn small{color:var(--t3)}
.tn.goal{background:var(--text);color:var(--bg);border-color:var(--text)}
.tn.goal small{color:inherit;opacity:.7}
.tn.check{border-style:dashed;border-color:var(--accent)}
.tn.sel{box-shadow:0 0 0 2px var(--accent)}
.tn.dim{opacity:.5}
.tn .cond{align-self:flex-start;font-size:11.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:0 8px}
.tn .st{font-size:11.5px;color:var(--ok)}
.ted{display:flex;flex-direction:column;gap:10px}
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- schedule ---------- */
.tsc{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table.tt{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
table.tt th,table.tt td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px;vertical-align:top}
table.tt th:first-child,table.tt td:first-child{border-left:0;width:54px;text-align:center;color:var(--t3);font-weight:400;font-size:12.5px}
table.tt thead th{font-weight:500;font-size:13px;background:var(--side)}
table.tt thead th small{display:block;color:var(--t3);font-weight:400}
table.tt .tdc{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.cell{display:block;width:100%;border:1px solid var(--line);border-left:3px solid var(--c-school);background:var(--panel);border-radius:8px;padding:5px 7px;text-align:left;font-size:12.5px;line-height:1.35;color:var(--text);margin-bottom:4px}
.cell:hover{background:var(--soft)}
.cell small{display:block;color:var(--t3)}
.cell.lab{border-left-color:var(--c-math)}
.ann{display:inline-block;font-size:10.5px;line-height:16px;border-radius:5px;padding:0 5px;margin-top:3px;background:var(--warn-soft);color:var(--warn)}

/* ---------- data dialog ---------- */
.dsec{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.dsec:first-of-type{border-top:0;padding-top:0}
.dsec h3{font-size:15px}
.dsec p{margin:0}
textarea.json{font:12px/1.5 var(--mono);min-height:120px}

@media (max-width:860px){
 .tgrid,.two,.tlay{grid-template-columns:minmax(0,1fr)}
 .tgrid.ready .side{order:-1}
}

 .app{grid-template-columns:minmax(0,1fr)}

 .hello{font-size:27px}
 .page{margin-top:22px}
 .wk{grid-template-columns:minmax(0,1fr)}
 .wcol{min-height:0}
 .clock{font-size:44px}
 .sr{grid-template-columns:76px minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- 解析 ---- */
const CNN={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cnNum(s){if(/^\d+(\.\d+)?$/.test(s))return +s;if(s in CNN)return CNN[s];const m=/^([一二两三四五六七八九])?十([一二三四五六七八九])?$/.exec(s);return m?(m[1]?CNN[m[1]]:1)*10+(m[2]?CNN[m[2]]:0):NaN;}
const NUM='(\\d+(?:\\.\\d+)?|[一二两三四五六七八九十]{1,3})';
function parse(text){
 let s=text,date=null,dl=null,est=null;const t=today();
 const take=(re,fn)=>{const m=re.exec(s);if(!m)return false;const r=fn(m);if(r===false)return false;s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length);return true;};
 take(/(大后天|后天|明天|明晚|今天|今晚)/,m=>{const n={大后天:3,后天:2,明天:1,明晚:1,今天:0,今晚:0}[m[1]];date=addDays(t,n);});
 if(!date)take(/(下周|下个?星期|下礼拜|本周|这周|周|星期|礼拜)([一二三四五六日天])/,m=>{const k='一二三四五六日天'.indexOf(m[2]);const di=k>5?6:k;let d=addDays(weekStart(t),di);if(/下/.test(m[1]))d=addDays(d,7);else if(!/本|这/.test(m[1])&&d<t)d=addDays(d,7);date=d;});
 if(!date)take(/(\d{1,2})月(\d{1,2})[日号]?/,m=>{const y=dt(t).getFullYear();let d=y+'-'+pad(m[1])+'-'+pad(m[2]);if(isNaN(dt(d))||dt(d).getMonth()+1!==+m[1])return false;if(d<addDays(t,-180))d=(y+1)+d.slice(4);date=d;});
 if(!date)take(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s|$)/,m=>{const y=dt(t).getFullYear();const d=y+'-'+pad(m[1])+'-'+pad(m[2]);if(isNaN(dt(d))||dt(d).getMonth()+1!==+m[1])return false;date=d;});
 // 时长
 take(new RegExp(NUM+'\\s*个?半\\s*(?:小时|钟头)'),m=>{est=Math.round((cnNum(m[1])+.5)*60);})||
 take(new RegExp(NUM+'\\s*(?:个)?\\s*(?:小时|钟头|h|hr|hrs)(?![a-z])\\s*(?:'+NUM+'\\s*(?:分钟|分|min|m)(?![a-z]))?','i'),m=>{const h=cnNum(m[1]),mm=m[2]?cnNum(m[2]):0;if(isNaN(h))return false;est=Math.round(h*60+(isNaN(mm)?0:mm));})||
 take(/半\s*(?:个)?\s*(?:小时|钟头)/,()=>{est=30;})||
 take(new RegExp(NUM+'\\s*(?:分钟|min|mins|minutes?)(?![a-z])','i'),m=>{const v=cnNum(m[1]);if(isNaN(v))return false;est=Math.round(v);});
 if(est!==null&&(est<1||est>1440))est=null;
 if(date)dl=dayLabel(date).split(' ')[0];
 const past=/(完成了|做完|写完|学完|看完|复习了|学了|做了|看了|写了|练了|背了|花了|用了|刚刚|刚才|已经)/.test(text);
 let title=s.replace(/[，,、]?\s*(花了|用了|大概|左右|以内)\s*/g,' ').replace(/\s+/g,' ').replace(/^[\s，,。、：:]+|[\s，,。、：:]+$/g,'').replace(/^我\s*/,'').trim();
 return {title,date,dl,est,cat:catOf(text),past};}

/* ---- Agent：本地规则或外部模型，把一句话变成任务 / 补记 / 反思 ---- */
const AG_DEF=()=>({on:true,model:'local',provider:'anthropic',modelId:'claude-sonnet-5-5',baseUrl:'https://api.deepseek.com',perms:{task:true,note:true,cat:true,confirm:true}});
const ag=()=>{const d=AG_DEF(),a=S.settings.agent||(S.settings.agent={});for(const k in d)if(a[k]===undefined)a[k]=d[k];for(const k in d.perms)if(a.perms[k]===undefined)a.perms[k]=d.perms[k];return a;};
let agentOnce=false,localOnce=false,agentBusy=null,agentPending=null;
const KEYK='tplan.v3.apikey';
const getKey=()=>{try{return localStorage.getItem(KEYK)||'';}catch(e){return '';}};
const setKey=v=>{try{v?localStorage.setItem(KEYK,v):localStorage.removeItem(KEYK);}catch(e){}};
const PROV={anthropic:'Anthropic（Claude）',openai:'OpenAI 兼容（DeepSeek、OpenAI、Ollama…）'};
const remoteReady=()=>{const a=ag();return a.provider==='openai'?!!a.baseUrl&&(!!getKey()||/localhost|127\.0\.0\.1/.test(a.baseUrl)):!!getKey();};
const modelLabel=()=>{const a=ag();if(!a.on||agentOnce)return 'Agent 关';return a.model==='local'?'本地规则':a.modelId;};
const agentOn=()=>ag().on&&!agentOnce;
const useRemote=()=>agentOn()&&!localOnce&&ag().model==='remote'&&remoteReady();
const NOTEY=/(反思|复盘|卡在|卡住|没想清|没搞懂|学到|收获|总结|错因|错了|下次)/;
function planItems(v){
 const a=ag(),on=agentOn(),tk=EC.taskId&&task(EC.taskId),out=[];
 const lines=v.split('\n').map(l=>l.trim()).filter(Boolean);
 for(const line of (mode==='note'?[v.trim()]:lines)){
  const p=parse(line);let type=mode;
  if(on&&mode==='task'){if(p.past&&p.est)type='log';else if(NOTEY.test(line))type='note';}
  if(type==='task'&&on&&!a.perms.task)type=null;
  if(type==='note'&&on&&!a.perms.note)type=null;
  const cat=EC.cat||tk?.cat||(on&&a.perms.cat?p.cat:'other');
  const title=(type==='note'?line:(p.title||line)).slice(0,300);
  out.push({type,line,title,date:EC.main&&type==='task'?today():EC.date||p.date||today(),est:EC.est||p.est||(type==='task'?30:null),cat});
 }
 return out;}
const TYPE_L={task:'任务',log:'补记',note:'反思'};
function chips(){
 const inp=$('#inp');if(!inp)return;const v=inp.value,h=[],x=(k,txt)=>`<span class="chip hit">${esc(txt)}<button class="x" data-x="${k}" aria-label="移除">×</button></span>`;
 if(EC.taskId&&task(EC.taskId))h.push(x('taskId','关联：'+task(EC.taskId).title));
 if(EC.course)h.push(x('course','课程：'+EC.course));
 if(EC.date)h.push(x('date','日期：'+dayLabel(EC.date)));
 if(EC.est)h.push(x('est',(mode==='log'?'用时 ':'预计 ')+EC.est+' 分钟'));
 if(EC.cat)h.push(x('cat','分类：'+catLabel(EC.cat)));
 if(EC.main&&mode==='task')h.push(x('main','今日主任务'));
 if(agentOnce)h.push(x('agentOnce','这一条不使用 Agent'));
 if(localOnce&&!agentOnce)h.push(x('localOnce','这一条改用本地规则'));
 let ok=!!v.trim()&&!agentBusy;
 if(v.trim()){
  const items=planItems(v);
  if(useRemote()){h.push(`<span class="chip hit">${esc(ag().modelId)} 会整理这段文字，保存前给你确认</span>`);}
  else if(items.length===1){const it=items[0];
   if(!it.type){h.push('<span class="chip warn">Agent 没有这类记录的权限，可在模型菜单的设置里打开</span>');ok=false;}
   else{

 else root=N(goal,0,0,'goal',[N('第一步',30,0)]);

const guessTpl=g=>/数学|极限|导数|积分|高数|线代|概率/.test(g)?'math':/实验|报告|数据/.test(g)?'lab':/课|章|复习|教材|课件/.test(g)?'course':'blank';
function walk(n,f,p=null){f(n,p);n.kids.forEach(k=>walk(k,f,n));}
function findNode(tr,id){let r=null,pp=null;walk(tr.root,(n,p)=>{if(n.id===id){r=n;pp=p;}});return [r,pp];}
function curTree(){const u=S.ui;let tr=S.trees.find(t=>t.id===u.tree);if(!tr&&S.trees.length){tr=S.trees[S.trees.length-1];u.tree=tr.id;}return tr;}
function pathNodes(tr){const out=[];let n=tr.root.kids[0];while(n){out.push(n);if(n.kind==='check'){const i=tr.chosen[n.id]??tr.pick[n.id]??0;n=n.kids[i];}else n=n.kids[0];}return out;}

  <p class="note-s">草稿生成后可以逐个改节点。AI 生成目前未接入：桌面版提供 <code>window.TPlanAI.generateTree(目标)</code> 后，这个按钮会自动可用，生成结果同样先进草稿、由你确认。</p></div></section>`;

 const path=pathNodes(tr),pathMin=path.reduce((a,n)=>a+n.min,0),added=Object.keys(tr.added).length;

 <button class="btn pri" data-act="tg-add" ${canAdd?'':'disabled'}>${!canAdd?'这条路径已全部加入':(added?'加入下一段':'加入安排')+'（到'+(nextCheck?'检查点「'+esc(nextCheck.title)+'」':'终点')+'）'}</button>

function drawTree(){
 const tr=curTree(),can=$('#tcan');if(!tr||!can)return;
 const W=176,CW=212,RH=86,PAD=16;let row=0;const pos={};
 (function lay(n,d){if(!n.kids.length){pos[n.id]={x:d,y:row++};return;}n.kids.forEach(k=>lay(k,d+1));pos[n.id]={x:d,y:(pos[n.kids[0].id].y+pos[n.kids[n.kids.length-1].id].y)/2};})(tr.root,0);
 const path=new Set([tr.root.id,...pathNodes(tr).map(n=>n.id)]),sel=S.ui.tnode;
 let maxX=0,maxY=0,html='',edges='';
 walk(tr.root,(n,p)=>{const P=pos[n.id],x=PAD+P.x*CW,y=PAD+P.y*RH;maxX=Math.max(maxX,x+W);maxY=Math.max(maxY,y+70);
  const tk=tr.added[n.id]&&task(tr.added[n.id]);
  const meta=n.kind==='goal'?`目标 · 所选路径 ${fmtMin(pathNodes(tr).reduce((a,x)=>a+x.min,0))}`:n.kind==='check'?`检查点 · 第 ${n.day+1} 天`:`${n.min} 分钟 · 第 ${n.day+1} 天`;
  html+=`<button class="tn ${n.kind} ${sel===n.id?'sel':''} ${path.has(n.id)?'':'dim'}" style="left:${x}px;top:${y}px" data-tnode="${n.id}">${p&&p.kind==='check'?`<span class="cond">${esc(n.cond||'分支')}</span>`:''}<b>${n.kind==='check'?'◇ ':''}${esc(n.title)}</b><small class="num">${meta}</small>${tk?`<span class="st">${tk.done?'✓ 已完成':'已加入安排'}</span>`:''}</button>`;
  if(p){const a=pos[p.id],x1=PAD+a.x*CW+W,y1=PAD+a.y*RH+30,x2=x,y2=y+30,on=path.has(n.id)&&path.has(p.id);edges+=`<path d="M${x1} ${y1}C${x1+24} ${y1},${x2-24} ${y2},${x2} ${y2}" fill="none" stroke="${on?'var(--accent)':'var(--line)'}" stroke-width="${on?2:1.5}"/>`;}});
 can.style.width=(maxX+PAD)+'px';can.style.height=(maxY+PAD)+'px';
 can.innerHTML=`<svg width="${maxX+PAD}" height="${maxY+PAD}" aria-hidden="true">${edges}</svg>`+html;}
function treeAdd(tr){const path=pathNodes(tr);let made=0;
 for(const n of path){if(!tr.added[n.id]){const date=addDays(tr.start,n.day)<today()?today():addDays(tr.start,n.day);const t=newTask({title:n.kind==='check'?'检查点：'+n.title:n.title,est:n.kind==='check'?10:n.min,date,cat:catOf(tr.goal+n.title),tree:{id:tr.id,node:n.id},check:n.kind==='check'});S.tasks.push(t);tr.added[n.id]=t.id;made++;}

function previewImport(o,name){const box=$('#impBox');
 if(o&&o.app==='tplan'&&Array.isArray(o.tasks)){pendingImport={kind:'new',o,name};box.innerHTML=`<div class="confirm" style="background:var(--warn-soft)">新版备份：任务 ${o.tasks.length} · 时间记录 ${(o.sessions||[]).length} · 反思 ${(o.notes||[]).length}。导入会<b>替换</b>现在的全部记录。<button class="btn sm pri" data-act="imp-go">确认替换</button><button class="btn sm" data-act="imp-cancel">取消</button></div>`;return;}
 if(o&&typeof o.schemaVersion==='number'&&Array.isArray(o.tasks)&&Array.isArray(o.logs)){const c=convertLegacy(o);pendingImport={kind:'legacy',o,name,c};
  box.innerHTML=`<div class="confirm" style="background:var(--warn-soft);flex-direction:column;align-items:flex-start"><span>旧版数据（schemaVersion ${o.schemaVersion}）会转换成：</span><span class="num">任务 ${c.tasks.length} · 时间记录 ${c.sessions.length}（投入记录 ${c.stat.logs}，其中 ${c.stat.merged} 条带有计时时刻；未确认的计时 ${c.stat.timers}） · 反思 ${c.notes.length}（任务备注 ${c.stat.taskNotes}，课程记录 ${c.stat.course}）${c.stat.timerNotes?'；'+c.stat.timerNotes+' 条计时卡点写进了对应时间记录的备注':''}</span><span class="num">只存档、不显示：流程编排 ${c.stat.maps} · 旁听 ${(o.attendance||[]).length} · 健康 ${(o.health||[]).length} · 周总结 ${Object.keys(o.reviews||{}).length}</span><span>${S.sample?'示例数据会先被清掉。':'会合并到现在的记录里，已经导入过的条目会跳过。'}原始文件整份存档。</span><span class="row"><button class="btn sm pri" data-act="imp-go">确认导入</button><button class="btn sm" data-act="imp-cancel">取消</button></span></div>`;return;}
 box.innerHTML='<p class="confirm">认不出这个文件：既不是新版备份，也不是旧版 T计划导出的数据。</p>';}
function convertLegacy(o){
 const tasks=[],sessions=[],notes=[],stat={logs:0,merged:0,timers:0,taskNotes:0,course:0,timerNotes:0,maps:(o.taskMaps?.plans||[]).length};
 const isoMs=v=>{const n=Date.parse(v);return isNaN(n)?null:n;};
 const tmap={};
 for(const t of o.tasks){const k={id:t.id,title:String(t.title||'未命名任务').slice(0,300),cat:t.category||'other',date:t.date,est:Number(t.estimatedMinutes)||0,done:t.status==='done',doneAt:t.status==='done'?isoMs(t.completedAt):null,pin:false,createdAt:isoMs(t.createdAt)||Date.now(),tree:null,check:false,legacy:{id:t.id,status:t.status}};tasks.push(k);tmap[t.id]=k;
  const txt=[t.notes&&'备注：'+t.notes,t.evidence&&'完成证据/卡点：'+t.evidence].filter(Boolean).join('\n');if(txt){notes.push({id:'L-tn-'+t.id,date:t.date,text:txt,taskId:t.id,course:null,cat:k.cat,at:isoMs(t.completedAt)||isoMs(t.createdAt),src:'legacy-task'});stat.taskNotes++;}}
 const logById={};
 for(const l of o.logs){const s={id:l.id,title:l.taskId&&tmap[l.taskId]?tmap[l.taskId].title:(CAT[l.category]||'学习')+'（投入记录）',taskId:l.taskId&&tmap[l.taskId]?l.taskId:null,cat:l.category||'other',course:null,date:l.date,start:null,end:null,minutes:Math.max(1,Math.round(l.minutes)),note:l.evidence||'',src:'legacy-log'};sessions.push(s);logById[l.id]=s;stat.logs++;}
 for(const r of (o.timerBoard?.records||[])){
  if(r.logId&&logById[r.logId]){const s=logById[r.logId];s.start=r.startedAt;s.end=r.startedAt+s.minutes*60000;if(r.title)s.title=r.title;stat.merged++;continue;}
  const min=Math.max(1,Math.round(r.elapsedMs/60000));const tk=r.taskId&&tmap[r.taskId];
  sessions.push({id:r.id,title:r.title||'计时',taskId:tk?r.taskId:null,cat:tk?tk.cat:catOf(r.title||''),course:null,date:dateOfMs(r.finishedAt||r.startedAt),start:r.startedAt,end:r.startedAt+min*60000,minutes:min,note:[r.blocker&&'卡点：'+r.blocker,r.next&&'下一步：'+r.next].filter(Boolean).join('；'),src:'legacy-timer'});stat.timers++;
  if(r.blocker){stat.timerNotes++;}}
 for(const p of (o.courseLearningPlans||[])){const txt=[p.topic&&'主题：'+p.topic,p.reflection&&'学会：'+p.reflection,p.unresolvedProblem&&'卡点：'+p.unresolvedProblem].filter(Boolean).join('\n');if(!txt)continue;
  notes.push({id:'L-cp-'+p.id,date:p.date,text:txt,taskId:null,course:COURSE_NAME[p.courseId]||p.courseId,cat:'school',at:null,src:'legacy-course'});stat.course++;}
 const main={};for(const [d,id] of Object.entries(o.mainByDate||{}))if(tmap[id])main[d]=id;
 return {tasks,sessions,notes,main,stat};}
function applyImport(){const p=pendingImport;if(!p)return;
 if(p.kind==='new'){S=normalize(p.o);S.sample=false;}
 else{if(S.sample)S=empty();const has=new Set([...S.tasks,...S.sessions,...S.notes].map(x=>x.id));let n=0;
  for(const k of ['tasks','sessions','notes'])for(const x of p.c[k])if(!has.has(x.id)){S[k].push(x);n++;}
  for(const [d,id] of Object.entries(p.c.main))if(!S.main[d])S.main[d]=id;
  S.archive={importedAt:Date.now(),fileName:p.name,raw:p.o};S.sample=false;toast(`已导入 ${n} 条记录，原始旧版数据已存档`);}
 pendingImport=null;save();closeDlg();render();}

/* ================= 事件 ================= */
document.addEventListener('click',e=>{
 const tgt=e.target;if(pop&&!pop.contains(tgt)&&!tgt.closest('#plus,#mdl'))closePop();
 const b=tgt.closest('button,[data-id].item');if(!b)return;const d=b.dataset;
 if(d.x){if(d.x==='agentOnce')agentOnce=false;else if(d.x==='localOnce')localOnce=false;else if(d.x==='date')EC.date=null;else if(d.x==='main')EC.main=false;else EC[d.x]=null;chips();return;}
 if(d.ck){const t=task(d.ck);if(t){setDone(t,!t.done);if(view==='today'){initComposer.keep=$('#inp')?.value||'';}render();}return;}
 if(d.pin){const t=task(d.pin);t.pin=!t.pin;save();renderSide();return;}
 if(b.classList.contains('item')){taskDialog(d.id);return;}
 if(d.go){go(d.go);return;}
 if(d.m){setMode(d.m);return;}
 if(d.fill!==undefined){if(view!=='today'){initComposer.keep=d.fill;mode=d.mode||'task';go('today');}else{mode=d.mode||'task';setMode(mode);$('#inp').value=d.fill;autosize();chips();}$('#inp')?.focus();return;}
 if(d.undo!==undefined){undo(+d.undo);return;}
 if(b.id==='plus'){e.stopPropagation();onPlus(b);return;}
 if(b.id==='send'){send();return;}
 if(b.id==='mdl'){e.stopPropagation();modelMenu(b);return;}
 if(b.id==='sbClose'||b.id==='sbOpen'){toggleSide();return;}
 if(b.id==='menuBtn'){document.body.classList.add('nav-open');return;}
 if(d.course){courseDialog(d.course);return;}
 if(d.pick!==undefined){const t=d.pick&&task(d.pick);draft.taskId=t?t.id:null;if(t){draft.title=t.title;draft.cat=t.cat;const est=t.est;draft.dur=[15,25,45,60].includes(est)?est:est>0&&est<=180?est:25;}else{draft.title=$('#tTitle').value;}render();return;}
 if(d.dur){draft.title=$('#tTitle')?.value||draft.title;draft.dur=d.dur==='up'?'up':+d.dur;render();return;}
 if(d.editS){sessionDialog(d.editS);return;}
 if(d.editN){noteDialog(d.editN);return;}
 if(d.rv){S.ui.rv=d.rv;render();return;}
 if(d.rvf){S.ui.rvF=d.rvf;render();return;}
 if(d.rvStep!==undefined){const n=+d.rvStep;if(S.ui.rv==='day')S.ui.rvDate=n===0?today():addDays(S.ui.rvDate,n);else S.ui.rvWeek=addDays(S.ui.rvWeek,n);render();return;}
 if(d.rvDay){S.ui.rv='day';S.ui.rvDate=d.rvDay;render();return;}
 if(d.wkStep!==undefined){const n=+d.wkStep;S.ui.wk=n===0?weekStart(today()):addDays(S.ui.wk,n);render();return;}
 if(d.wkadd){S.ui.wkAdd=d.wkadd;render();$('#wkIn')?.focus();return;}
 if(d.w&&b.classList.contains('wc')){taskDialog(d.w);return;}
 if(d.sw!==undefined){const n=+d.sw;S.ui.sw=n===0?tWeek(today()):Math.max(1,Math.min(20,S.ui.sw+n));render();return;}
 if(d.tree){S.ui.tree=d.tree;S.ui.treeNew=false;S.ui.tnode=null;render();return;}
 if(d.tnode){S.ui.tnode=d.tnode;const tr=curTree();$('#ted').innerHTML=treeEditor(tr);drawTree();return;}
 if(d.pickBr){const [c,i]=d.pickBr.split('|');const tr=curTree();tr.pick[c]=+i;save();render();return;}
 if(d.tn){const tr=curTree();const [n,p]=findNode(tr,S.ui.tnode);if(!n)return;
  if(d.tn==='first'){const k=N('第一步',30,0);n.kids.push(k);S.ui.tnode=k.id;}
  if(d.tn==='next'){const k=N('下一步',30,n.day,'step',n.kids);n.kids=[k];S.ui.tnode=k.id;}
  if(d.tn==='branch'){const k=N('新的分支步骤',30,n.day+1,'step',[],'分支 '+(n.kids.length+1));n.kids.push(k);S.ui.tnode=k.id;}
  if(d.tn==='del'&&p){if(p.kind==='check'&&p.kids.length<=2){return toast('检查点至少要有两个分支；可以先把检查点改成步骤');}p.kids=p.kids.filter(x=>x!==n);S.ui.tnode=p.id;for(const k in tr.pick)if(!findNode(tr,k)[0])delete tr.pick[k];}
  save();render();return;}
 if(d.branch){const [tid,nid,i]=d.branch.split('|');const tr=S.trees.find(x=>x.id===tid);if(!tr)return;tr.chosen[nid]=+i;tr.pick[nid]=+i;closeDlg();treeAdd(tr);return;}
 const act=d.act;if(!act)return;
 switch(act){
 case 'data':dataDialog();break;
 case 'dlg-close':closeDlg();break;
 case 'panel-off':S.settings.panelOff=true;save();initComposer.keep=$('#inp')?.value||'';render();break;
 case 'panel-on':S.settings.panelOff=false;save();initComposer.keep=$('#inp')?.value||'';render();break;
 case 'clear-sample':S=empty();save();feedItems=[];toast('示例已清空，可以开始记录了');render();break;
 case 'to-log':setMode('log');break;
 case 'ag-save':{const p=agentPending;if(!p)break;const pick=$$('[data-agi]').filter(c=>c.checked).map(c=>p.items[+c.dataset.agi]);const keep=EC;EC=p.ctx;const n=commitItems(pick,'agent');EC=keep;agentPending=null;$('#feed').innerHTML=feedHtml();toast(n?'已保存 '+n+' 条':'没有选中任何条目');break;}
 case 'ag-drop':agentPending=null;$('#feed').innerHTML=feedHtml();toast('已放弃这次整理');break;
 case 'ag-cfg-save':{agentReadForm();const a=ag();if(remoteReady())a.model='remote';save();closeDlg();chips();toast(remoteReady()?'已保存，Agent 会用 '+a.modelId:'已保存。还缺 API Key 或接口地址，暂时继续用本地规则');break;}
 case 'ag-test':(async()=>{agentReadForm();save();const box=$('#agTest');box.innerHTML='<p class="note-s">正在测试……</p>';try{const r=await remoteItems('明天 复习模电 45分钟');box.innerHTML=`<p class="confirm" style="background:var(--ok-soft)">连接正常，模型返回了 ${r.length} 条：${esc(r.map(x=>x.title).join('、'))}</p>`;}catch(err){box.innerHTML=`<p class="confirm">连接失败：${esc(err.message)}</p>`;}})();break;
 case 't-start':startTimer();break;
 case 't-pause':tctl('pause');break;case 't-resume':tctl('resume');break;case 't-add5':tctl('add5');break;case 't-up':tctl('up');break;case 't-end':tctl('end');break;
 case 't-pip':openPip();break;
 case 'w-save':wrapSave();break;
 case 'w-discard':$('#wConfirm').innerHTML='<div class="confirm">放弃后这一轮不会留下记录。<button class="btn sm danger" data-act="w-discard-go">放弃</button><button class="btn sm" data-act="w-discard-no">保留</button></div>';break;
 case 'w-discard-go':S.active=null;save();toast('已放弃这一轮');render();break;
 case 'w-discard-no':$('#wConfirm').innerHTML='';break;
 case 'add-session':sessionDialog(null,d.date);break;
 case 'se-save':sessionSave(d.id||null);break;
 case 'se-del':$('#seDelWrap').innerHTML=`<span class="confirm">删掉这段记录？<button class="btn sm danger" data-act="se-del-go" data-id="${d.id}">删除</button></span>`;break;
 case 'se-del-go':S.sessions=S.sessions.filter(x=>x.id!==d.id);save();closeDlg();toast('已删除');render();break;
 case 'ne-save':{const n=S.notes.find(x=>x.id===d.id);const v=$('#neText').value.trim();if(!v)return toast('内容不能为空');n.text=v;n.date=$('#neDate').value||n.date;save();closeDlg();render();break;}
 case 'ne-del':$('#neDelWrap').innerHTML=`<span class="confirm">删掉这条反思？<button class="btn sm danger" data-act="ne-del-go" data-id="${d.id}">删除</button></span>`;break;
 case 'ne-del-go':S.notes=S.notes.filter(x=>x.id!==d.id);save();closeDlg();render();break;
 case 'md':copyText(mdText());break;
 case 'td-timer':{const t=task(d.id);if(S.active){toast('先结束当前这一轮');break;}draft={title:t.title,taskId:t.id,cat:t.cat,course:null,dur:[15,25,45,60].includes(t.est)?t.est:t.est>0&&t.est<=180?t.est:25};closeDlg();go('timer');break;}
 case 'td-done':{const t=task(d.id);closeDlg();setDone(t,!t.done);toast(t.done?'已完成':'已改回未完成');render();break;}
 case 'td-note':{const t=task(d.id);closeDlg();EC=E0();EC.taskId=t.id;mode='note';go('today');break;}
 case 'td-tmr':{const t=task(d.id);t.date=addDays(today(),1);save();closeDlg();toast('已推到明天');render();break;}
 case 'td-del':$('#tdActs').innerHTML=`<div class="confirm">删除这个任务？它的时间记录和反思会保留，只是不再关联任务。<button class="btn sm danger" data-act="td-del-go" data-id="${d.id}">删除</button><button class="btn sm" data-act="td-del-no" data-id="${d.id}">取消</button></div>`;break;
 case 'td-del-no':taskDialog(d.id);break;
 case 'td-del-go':{S.tasks=S.tasks.filter(x=>x.id!==d.id);for(const s of S.sessions)if(s.taskId===d.id)s.taskId=null;for(const n of S.notes)if(n.taskId===d.id)n.taskId=null;for(const k in S.main)if(S.main[k]===d.id)delete S.main[k];for(const tr of S.trees)for(const k in tr.added)if(tr.added[k]===d.id)delete tr.added[k];save();closeDlg();toast('已删除任务');render();break;}
 case 'c-timer':{if(S.active){toast('先结束当前这一轮');break;}draft={title:d.name,taskId:null,cat:'school',course:d.name,dur:45};closeDlg();go('timer');break;}
 case 'c-note':closeDlg();EC=E0();EC.course=d.name;mode='note';go('today');break;
 case 'tg-new':S.ui.treeNew=true;S.ui.treeGoal='';render();break;
 case 'tg-cancel':S.ui.treeNew=false;render();break;
 case 'tg-make':{const g=$('#tgGoal').value.trim();if(!g){$('#tgGoal').focus();return toast('先写下目标');}let k=$('#tgTpl').value;if(k==='auto')k=guessTpl(g);const tr=templateTree(k,g);S.trees.push(tr);S.ui.tree=tr.id;S.ui.treeNew=false;S.ui.treeGoal='';S.ui.tnode=null;save();render();break;}
 case 'tg-ai':(async()=>{const g=$('#tgGoal').value.trim();if(!g)return toast('先写下目标');try{const r=await window.TPlanAI.generateTree(g);const fix=n=>({id:uid('n'),kind:['step','check','goal'].includes(n.kind)?n.kind:'step',title:String(n.title||'步骤').slice(0,150),min:Math.max(0,Math.min(600,+n.min||0)),day:Math.max(0,Math.min(59,+n.day||0)),cond:String(n.cond||''),kids:(n.kids||[]).map(fix)});const tr={id:uid('tr'),goal:g,createdAt:Date.now(),start:today(),root:{...fix(r),kind:'goal',title:g},added:{},chosen:{},pick:{}};S.trees.push(tr);S.ui.tree=tr.id;S.ui.treeNew=false;save();render();toast('AI 草稿已生成，请逐个检查节点');}catch(err){toast('AI 生成失败：'+(err?.message||err));}})();break;
 case 'tg-add':{const tr=curTree();const v=$('#tgStart').value;if(v)tr.start=v;treeAdd(tr);break;}
 case 'tg-del':$('#tgDel').innerHTML='<span class="confirm">删除这棵树？已加入安排的任务会保留。<button class="btn sm danger" data-act="tg-del-go">删除</button></span>';break;
 case 'tg-del-go':{const tr=curTree();S.trees=S.trees.filter(x=>x!==tr);for(const t of S.tasks)if(t.tree?.id===tr.id)t.tree=null;S.ui.tree=null;S.ui.tnode=null;save();render();break;}
 case 'exp':{const j=exportJSON();download(j,'T计划备份_'+today()+'.json');copyBox($('#expBox'),j,'如果没有开始下载，可以复制下面的内容，保存成 .json 文件');break;}
 case 'exp-raw':copyBox($('#expBox'),JSON.stringify(S.archive.raw,null,1),'旧版原始 JSON（可以导回旧版）');break;
 case 'copy-json':{const ta=b.closest('div').previousElementSibling;ta.select();copyText(ta.value);break;}
 case 'imp':$('#fileIn').value='';$('#fileIn').click();break;
 case 'imp-go':applyImport();break;
 case 'imp-cancel':pendingImport=null;$('#impBox').innerHTML='';break;
 case 'clr':$('#clrBox').innerHTML='<div class="confirm">清空后所有任务、时间记录、反思和旧版存档都会删除，无法恢复。建议先导出备份。<button class="btn sm danger" data-act="clr-go">清空</button><button class="btn sm" data-act="clr-no">取消</button></div>';break;
 case 'clr-no':$('#clrBox').innerHTML='<button class="btn danger" data-act="clr">清空全部记录</button>';break;
 case 'clr-go':S=empty();save();closeDlg();feedItems=[];toast('已清空');render();break;
 }
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='inp'){autosize();chips();return;}
 if(t.id==='tTitle'){draft.title=t.value;return;}
 if(t.id==='tCustom'){const n=Math.round(+t.value);if(n>=1&&n<=180){draft.dur=n;$$('.durs button').forEach(x=>x.classList.remove('on'));const c=$('#bigClock');if(c&&!S.active)c.textContent=clock(n*60000);}return;}
 if(['tnTitle','tnCond','tnMin','tnDay'].includes(t.id)){treeInput(e);return;}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='agProv'){$('#agUrlRow').hidden=t.value!=='openai';if(t.value==='openai'&&/^claude/.test($('#agModel').value))$('#agModel').value='deepseek-chat';if(t.value==='anthropic'&&!/^claude/.test($('#agModel').value))$('#agModel').value='claude-sonnet-5-5';return;}
 if(t.id==='tnKind'){treeInput(e);return;}
 if(t.dataset.tid){const k=task(t.dataset.tid);if(!k)return;
  if(t.id==='tdTitle'&&t.value.trim())k.title=t.value.trim().slice(0,150);
  if(t.id==='tdDate'&&t.value)k.date=t.value;
  if(t.id==='tdEst')k.est=Math.max(0,Math.min(1440,Math.round(+t.value)||0));
  if(t.id==='tdCat')k.cat=t.value;
  if(t.id==='tdPin')k.pin=t.checked;
  if(t.id==='tdMain'){if(t.checked)S.main[today()]=k.id;else if(S.main[today()]===k.id)delete S.main[today()];}
  save();renderSide();if(view!=='today')render();return;}
 if(t.id==='capIn'){const n=Math.round(+t.value);if(n>=30&&n<=1440){S.settings.cap=n;save();if(view==='week')render();}return;}
 if(t.id==='tgStart'){const tr=curTree();if(tr&&t.value){tr.start=t.value;save();}return;}
 if(t.id==='fileIn'&&t.files[0]){if(!dlg.open)dataDialog();readImport(t.files[0]);}
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();toggleSide();return;}
 if(e.key==='Escape'){closePop();document.body.classList.remove('nav-open');}
 const t=e.target;
 if(t.id==='inp'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!$('#send').disabled)send();return;}
 if(t.id==='tTitle'&&e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();startTimer();return;}
 if(t.id==='tgGoal'&&e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();$('[data-act="tg-make"]').click();return;}
 if(t.id==='wkIn'){if(e.key==='Escape'){S.ui.wkAdd=null;render();return;}if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();const v=t.value.trim();if(v){const p=parse(v);S.tasks.push(newTask({title:p.title||v,cat:p.cat,date:t.dataset.d,est:p.est||30}));save();}S.ui.wkAdd=null;render();}return;}
 if(t.classList?.contains('item')&&e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();const sib=[...t.closest('.grp').querySelectorAll('.item')],k=sib.indexOf(t),n=sib[k+(e.key==='ArrowUp'?-1:1)];if(!n)return;const x=task(t.dataset.id),y=task(n.dataset.id);if(t.closest('.grp').dataset.g==='L'&&x.date!==y.date){x.date=y.date;toast('已改到 '+dayLabel(x.date));}S.tasks=S.tasks.filter(z=>z!==x);S.tasks.splice(S.tasks.indexOf(y)+(e.key==='ArrowUp'?0:1),0,x);save();renderSide();$(`.item[data-id="${x.id}"]`)?.focus();return;}
 if(t.classList?.contains('item')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();taskDialog(t.dataset.id);}
});
$('#scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));
function toggleSide(){if(innerWidth<=760){document.body.classList.toggle('nav-open');return;}document.body.classList.toggle('c');$('#sbOpen').hidden=!document.body.classList.contains('c');}
dlg.addEventListener('close',()=>{pendingImport=null;});

/* ---- 拖拽：侧栏分组与本周列 ---- */
let drag=null,wd=null;
const clr=()=>$$('.over,.over-after,.drag').forEach(x=>x.classList.remove('over','over-after','drag'));
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.wc'),i=e.target.closest?.('.item');
 if(c){wd=c.dataset.w;c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',wd);return;}
 if(i){drag=i.dataset.id;i.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag);}});
const below=(e,i)=>{const r=i.getBoundingClientRect();return e.clientY>r.top+r.height/2;};
document.addEventListener('dragover',e=>{if(!drag&&!wd)return;e.preventDefault();$$('.over,.over-after').forEach(x=>x.classList.remove('over','over-after'));if(wd){e.target.closest('.wcol')?.classList.add('over');return;}const i=e.target.closest('.item');if(i&&i.dataset.id!==drag){i.classList.add(below(e,i)?'over-after':'over');return;}e.target.closest('.grp')?.classList.add('over');});
document.addEventListener('drop',e=>{
 if(wd){e.preventDefault();const w=e.target.closest('.wcol'),x=task(wd);if(w&&x&&x.date!==w.dataset.d){x.date=w.dataset.d;save();toast('已移到 '+dayLabel(x.date));render();}wd=null;clr();return;}
 if(!drag)return;e.preventDefault();const i=e.target.closest('.item'),g=e.target.closest('.grp');const x=task(drag);
 if(x){const t=today();const grp=(i?i.closest('.grp'):g)?.dataset.g;
  if(grp==='P')x.pin=true;else if(grp==='T'){x.pin=false;if(x.date!==t&&!(x.date<t&&!x.done))x.date=t;}else if(grp==='L'){x.pin=false;if(x.date<=t)x.date=addDays(t,1);}
  const tgt=i&&i.dataset.id!==x.id?task(i.dataset.id):null;if(tgt&&grp==='L'&&x.date!==tgt.date){x.date=tgt.date;toast('已改到 '+dayLabel(x.date));}
  S.tasks=S.tasks.filter(y=>y!==x);const at=tgt?S.tasks.indexOf(tgt)+(below(e,i)?1:0):-1;if(at>=0)S.tasks.splice(at,0,x);else S.tasks.push(x);save();renderSide();if(view!=='today')render();}
 drag=null;clr();});
document.addEventListener('dragend',()=>{drag=null;wd=null;clr();});

/* ---- 其他标签页改了数据 ---- */
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const ui=S.ui;S=normalize(JSON.parse(e.newValue));S.ui=ui;render();}catch(err){}});

/* ================= 启动 ================= */
load();
const h=(location.hash||'').slice(1);if(VIEWS.includes(h))view=h;
render();
setInterval(tick,500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
})();
</script>

</body>
