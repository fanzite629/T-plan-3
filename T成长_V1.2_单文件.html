/* T计划 1.10 候选：Claude 风格主题。只改外观，加载在所有样式之后；业务数据与规则不受影响。
   SVG 图形的颜色由各视图以属性写入，这里用属性选择器重新着色，不修改脚本。 */
:root{
 --c-bg:#FAF9F5;--c-side:#F3F1EA;--c-panel:#FFFFFF;--c-soft:#F0EEE6;--c-line:#E6E3D9;--c-line-strong:#D6D2C4;
 --c-text:#1F1E1D;--c-text-2:#5E5D59;--c-text-3:#6A6861;
 --c-accent:#C96442;--c-accent-strong:#AE5332;--c-accent-hover:#96462A;--c-on-accent:#FFFFFF;--c-accent-soft:#F6E7DF;--c-accent-text:#9F4A2B;--c-accent-mute:#DDA48D;
 --c-ink:#1F1E1D;--c-ink-hover:#3A3936;--c-ink-text:#FAF9F5;
 --c-ok:#4A6B3F;--c-ok-soft:#E7EEDF;--c-warn:#875A0E;--c-warn-soft:#F5ECD9;--c-danger:#B3412E;--c-danger-soft:#F8E6E1;--c-danger-line:#EBC3BA;
 --c1:#C96442;--c2:#6A8CAF;--c3:#7E9F6A;--c4:#B48A3C;--c5:#9A7AA8;
 --heat0:#F0EEE6;--heat0t:#5E5D59;--heat1:#F3DDD2;--heat1t:#7A3D24;--heat2:#E8B9A3;--heat2t:#5A2A16;--heat3:#D27F5F;--heat3t:#1F1E1D;--heat4:#A9502F;--heat4t:#FFFFFF;
 --shadow-pop:0 20px 60px rgba(30,25,15,.18);--shadow-menu:0 10px 30px rgba(30,25,15,.12);--backdrop:rgba(31,30,29,.32);
 --serif:"Noto Serif SC","Source Han Serif SC","Source Han Serif CN","Songti SC","STSong",Georgia,serif;
 --sans:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
 /* 旧样式变量映射到新主题，未单独覆盖的规则也随之改色。 */
 --blue:var(--c-accent-text);--blue-deep:var(--c-accent-text);--blue-light:var(--c-accent-soft);--ink:var(--c-text);--muted:var(--c-text-3);
 --line:var(--c-line);--bg:var(--c-bg);--white:var(--c-panel);--warm:var(--c-warn-soft);--coral:var(--c-danger);--radius:16px;
 color-scheme:light;font-family:var(--sans);color:var(--c-text);background:var(--c-bg)
}

 --c-bg:#262624;--c-side:#1F1E1D;--c-panel:#30302E;--c-soft:#383835;--c-line:#3D3D3A;--c-line-strong:#4B4A46;
 --c-text:#ECEAE3;--c-text-2:#C2C0B8;--c-text-3:#A3A198;
 --c-accent:#D97757;--c-accent-strong:#D97757;--c-accent-hover:#E58B6D;--c-on-accent:#1F1E1D;--c-accent-soft:#4A3229;--c-accent-text:#EBA082;--c-accent-mute:#8A5440;
 --c-ink:#ECEAE3;--c-ink-hover:#FFFFFF;--c-ink-text:#1F1E1D;
 --c-ok:#9DBF8C;--c-ok-soft:#2F3A2B;--c-warn:#DDB063;--c-warn-soft:#41372A;--c-danger:#EA8C78;--c-danger-soft:#43292A;--c-danger-line:#6B3A33;
 --c1:#D97757;--c2:#8FAACB;--c3:#9DBB88;--c4:#CDA65A;--c5:#B497C2;
 --heat0:#383835;--heat0t:#A3A198;--heat1:#4A3229;--heat1t:#EBC6B6;--heat2:#6E412F;--heat2t:#F5DCD0;--heat3:#A85A3D;--heat3t:#FFFFFF;--heat4:#D97757;--heat4t:#1F1E1D;

/* ---------- 基础 ---------- */
body{background:var(--c-bg);background-image:none;color:var(--c-text)}
h1,h2,h3,h4{color:var(--c-text)}
h1{font-family:var(--serif);font-weight:500;letter-spacing:.01em}
small,.muted{color:var(--c-text-3)}
a{color:var(--c-accent-text)}
button{background:var(--c-panel);border:1px solid var(--c-line-strong);color:var(--c-text);border-radius:9px;box-shadow:none;font-weight:500}
button:hover{background:var(--c-soft);border-color:var(--c-line-strong)}
button:active:not(:disabled){background:var(--c-soft)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.primary{background:var(--c-ink);border-color:var(--c-ink);color:var(--c-ink-text);box-shadow:none}
.primary:hover,.primary:active:not(:disabled){background:var(--c-ink-hover);border-color:var(--c-ink-hover);color:var(--c-ink-text)}
.quiet{background:transparent;border-color:transparent;color:var(--c-text-2)}
.quiet:hover{background:var(--c-soft);color:var(--c-text)}
.danger{color:var(--c-danger);background:var(--c-panel);border-color:var(--c-danger-line)}
.danger:hover{background:var(--c-danger-soft);border-color:var(--c-danger-line)}
input,select,textarea,.field textarea{background:var(--c-bg);border-color:var(--c-line-strong);color:var(--c-text)}
input:focus,textarea:focus,select:focus{border-color:var(--c-accent);background:var(--c-panel);box-shadow:0 0 0 3px var(--c-accent-soft)}
input[type=checkbox]{accent-color:var(--c-accent)}
.field label,.field>span{color:var(--c-text-2)}
.form-error{color:var(--c-danger)}
.wb-skip{background:var(--c-panel);border-color:var(--c-accent);color:var(--c-text)}

/* ---------- 顶栏 ---------- */
.wb-topbar{background:color-mix(in srgb,var(--c-bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom-color:var(--c-line)}
.wb-topbar .brandmark{width:30px;height:30px;min-width:30px;border-radius:8px;background:var(--c-accent);display:grid;place-items:center;color:#fff;font:600 17px/1 var(--serif)}
.wb-topbar .brandmark img{display:none}
.wb-topbar .brandmark::before{content:"T"}
.wb-topbar .brand strong{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.02em;color:var(--c-text)}
.wb-breadcrumb{color:var(--c-text-3)}.wb-breadcrumb strong{color:var(--c-text);font-weight:500}
.wb-local{color:var(--c-text-3)}.wb-local::before{background:var(--c-ok)}
#wb-idle-timer{background:var(--c-panel);border:1px solid var(--c-line);color:var(--c-text-2);border-radius:999px;font-weight:500}
#wb-idle-timer:hover{background:var(--c-soft)}
#tt-global{background:var(--c-panel);border:1px solid var(--c-line);color:var(--c-text);border-radius:999px;box-shadow:none;font-weight:500}
#tt-global::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft);margin-right:9px;vertical-align:1px}
.wb-top-actions .wb-new-task{border-radius:9px}

/* ---------- 侧栏 ---------- */
.sidebar{background:var(--c-side);border-right-color:var(--c-line);box-shadow:none}
.wb-space-label{border-bottom-color:var(--c-line)}.wb-space-label strong{color:var(--c-text);font-weight:600}.wb-space-label small{color:var(--c-text-3)}
.wb-space-mark{background:var(--c-panel);box-shadow:0 0 0 1px var(--c-line);color:var(--c-accent-text);font-family:var(--serif);font-weight:600}
.wb-nav-label{color:var(--c-text-3);letter-spacing:.06em;font-weight:500}
.sidebar nav button{color:var(--c-text-2);background:transparent;border:0;min-height:40px;padding:8px 12px;border-radius:8px;font-weight:500}
.sidebar nav button:hover{background:var(--c-soft);color:var(--c-text)}
.sidebar nav button.active{background:var(--c-panel);color:var(--c-text);box-shadow:0 0 0 1px var(--c-line);font-weight:600}
.sidebar nav button.active .nav-icon{color:var(--c-accent-text);fill:none}
.sidebar nav button.active::after{background:var(--c-accent)}
.sidebar nav button.active::before{background:var(--c-accent)}
.sidebottom{border-top-color:var(--c-line)}.sidebottom button{color:var(--c-text-2)}.sidebottom small,.sidebottom p{color:var(--c-text-3)}
.wb-nav-open .wb-shade{background:var(--backdrop)}

/* ---------- 页面标题 ---------- */
.page-head,.wb-hero{background:transparent;border:0;border-radius:0;box-shadow:none;padding:6px 2px 0;margin-bottom:24px}
.wb-hero{min-height:0}
.page-head h1,.wb-hero h1,.tt-heading h1{font:400 30px/1.3 var(--serif);color:var(--c-text);letter-spacing:.01em}
.page-head .muted,.wb-hero .muted{color:var(--c-text-3)}
.eyebrow,.wb-hero .eyebrow,.tt-heading .eyebrow{color:var(--c-accent-text);letter-spacing:.06em;font-weight:500}

/* ---------- 卡片与通用文字 ---------- */
.card{background:var(--c-panel);border:1px solid var(--c-line);border-radius:16px;box-shadow:none}
.card h2,.card-head h2{color:var(--c-text);font-weight:600}
.card-head h2 small,.card-head>small{color:var(--c-text-3)}
.today-focus,.today-courses,.today-progress{border-top:1px solid var(--c-line)}
.today-focus .card-head h2>.ui-icon{color:var(--c-accent)}
.meta,.form-note,.empty,.goal-note,.secondary-label,.quiet-motto,.progress-summary,.chart-caption,.dashboard-scope,.review-label,.today-progress .progress-summary{color:var(--c-text-3)}
.progress-summary strong{color:var(--c-text)}
.evidence{border-left-color:var(--c-line-strong);color:var(--c-text-2)}
.empty-box,.today-focus .empty-box{background:var(--c-bg);border:1px dashed var(--c-line-strong)}
.empty-box h3{color:var(--c-text)}.empty-box p{color:var(--c-text-3)}
.secondary-label,.focus-footer,.task-row,.list-row,.course-row,.course-today,.course-history-row,.calendar-day,.learning-section,.fitness-comparison,.weight-foot{border-top-color:var(--c-line)}
.hero-task{background:var(--c-bg);border-color:var(--c-line)}
.today-focus .hero-task{background:transparent;border:0}
.hero-task h3{font:400 21px/1.5 var(--serif);color:var(--c-text)}
.hero-task>.badge{background:var(--c-accent-soft);color:var(--c-accent-text)}
.badge{background:var(--c-soft);color:var(--c-text-2);border-radius:6px}
.badge.warm{background:var(--c-warn-soft);color:var(--c-warn)}
.notice{background:var(--c-warn-soft);color:var(--c-warn);border-color:transparent}
.persistent-error{background:var(--c-danger-soft);color:var(--c-danger)}
.toast{background:var(--c-ink);color:var(--c-ink-text);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:10px}
details summary{color:var(--c-text)}
.frozen{border-left-color:var(--c-warn)}
.date-strip{background:var(--c-soft);border-color:var(--c-line);color:var(--c-text-2)}

.review-text{background:var(--c-bg);border-color:var(--c-line)}

/* ---------- 一句话新建任务 ---------- */
.qa-composer{background:var(--c-panel);border:1px solid var(--c-line-strong);border-radius:18px;padding:12px 12px 10px 18px;margin:0 0 24px;box-shadow:0 2px 10px rgba(60,50,30,.05);transition:border-color .15s,box-shadow .15s}
.qa-composer:focus-within{border-color:var(--c-accent);box-shadow:0 0 0 1px var(--c-accent),0 0 0 4px var(--c-accent-soft)}
.qa-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
#qa-text{display:block;width:100%;min-width:0;border:0;border-radius:0;background:transparent;box-shadow:none;padding:6px 0 4px;font-size:16px;color:var(--c-text)}
#qa-text:focus,#qa-text:focus-visible{outline:none;box-shadow:none;background:transparent}
#qa-text::placeholder{color:var(--c-text-3)}
.qa-hint{margin:2px 0 8px;font-size:12px;line-height:1.7;color:var(--c-text-3);overflow-wrap:anywhere}
.qa-hint.is-error{color:var(--c-danger)}
.qa-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qa-row select{width:auto;max-width:100%;height:30px;min-height:30px;padding:0 8px;border:1px solid var(--c-line);border-radius:8px;background:transparent;color:var(--c-text-2);font-size:13px;box-shadow:none}

.qa-row .quiet{min-height:30px;padding:4px 10px;font-size:13px}
.qa-grow{flex:1}
.qa-send{width:34px;height:34px;min-height:34px;padding:0;display:grid;place-items:center;border:0;border-radius:10px;background:var(--c-accent-strong);color:var(--c-on-accent)}
.qa-send:hover,.qa-send:active:not(:disabled){background:var(--c-accent-hover);border-color:transparent;color:var(--c-on-accent)}
.qa-send svg{width:17px;height:17px}
.qa-composer .form-error{margin:6px 0 0}
.qa-composer .form-error:empty{display:none}
@media(max-width:480px){.qa-composer{padding:10px 10px 8px 14px;border-radius:16px}}

/* ---------- 今日指标 ---------- */
.wb-metrics .wb-metric{background:var(--c-panel);border:1px solid var(--c-line);border-radius:14px;box-shadow:none}

.wb-metric-name,.wb-metric .ui-icon,.wb-metric>span:last-child{color:var(--c-text-3)}
.wb-metric strong{font:400 30px/1.35 var(--serif);color:var(--c-text)}

/* ---------- 今日课程与进度 ---------- */

.today-courses .course-today::before{background:var(--c2)}

/* ---------- 本周安排 ---------- */
.week-switch{background:var(--c-panel);border-color:var(--c-line);box-shadow:none}

/* ---------- 课表 ---------- */

/* ---------- 数据与记录 ---------- */
.health-stats strong,.learning-facts strong{font-family:var(--serif);font-weight:400;color:var(--c-text)}
.health-stats strong small,.learning-facts strong small{font-family:var(--sans)}

/* ---------- 弹窗与课程详情 ---------- */
dialog{background:var(--c-panel);color:var(--c-text);border:1px solid var(--c-line);box-shadow:var(--shadow-pop)}

.course-detail-hero{background:var(--c-bg);border-color:var(--c-line)}

.learning-list{color:var(--c-text-2)}

/* ---------- 投入看板 ---------- */

[fill="#3978cf"]{fill:var(--c1)}[fill="#568bdb"]{fill:var(--c2)}[fill="#3762a6"]{fill:var(--c3)}[fill="#7396c9"]{fill:var(--c4)}[fill="#4a6fbd"]{fill:var(--c5)}

.fs-metric strong{font-family:var(--serif);font-weight:400;color:var(--c-text)}
.fs-metric span,.fs-metric small{color:var(--c-text-3)}
.fs-trend p,.fs-guide p{color:var(--c-text-3)}

.fs-record{border-top-color:var(--c-line)}.fs-record>span{color:var(--c-text-2)}

.heat-3,.fs-heat-cell.heat-3:hover{background:var(--heat3);color:var(--heat3t)}
.heat-4,.fs-heat-cell.heat-4:hover{background:var(--heat4);color:var(--heat4t)}

const esc=value=>String(value??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const hours=value=>Number((value/60).toFixed(2)).toLocaleString('zh-CN',{maximumFractionDigits:2});
const pct=value=>value===null?'—':value.toFixed(1)+'%';
const empty='<div class="chart-empty">开始记录后，这里会形成趋势。</div>';
const svg=(body,label,viewBox='0 0 360 240')=>`<svg class="data-chart" viewBox="${viewBox}" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title>${body}</svg>`;
const card=(id,title,note,content)=>`<section class="card dashboard-card" data-chart="${id}"><div class="card-head"><h2>${title}</h2></div><p class="chart-caption">${note}</p>${content}</section>`;
function comparison(d){
 const max=Math.max(60,...d.comparison.flatMap(x=>[x.targetMinutes,x.actualMinutes]));
 const rows=d.comparison.map(x=>`<div class="comparison-row" data-category="${esc(x.id)}" data-target-minutes="${x.targetMinutes}" data-actual-minutes="${x.actualMinutes}"><div class="chart-row-label"><strong>${esc(x.label)}</strong><span>目标 ${hours(x.targetMinutes)}h · 实际 <b>${hours(x.actualMinutes)}h</b></span></div>${svg(`<rect x="0" y="2" width="${x.targetMinutes/max*360}" height="8" rx="3" fill="#dce7f5"/><rect x="0" y="16" width="${x.actualMinutes/max*360}" height="8" rx="3" fill="${palette[x.id]}"/>`,`${x.label}，目标${hours(x.targetMinutes)}小时，实际${hours(x.actualMinutes)}小时`,'0 0 360 28')}</div>`).join('');
 return card('comparison','本周任务预计投入 vs 实际投入','浅条为你创建任务时填写的预计耗时，深条为本周关联该任务的实际投入。单位：小时。',
 (rows||'<div class="chart-empty">本周还没有安排任务。新建任务后自动显示对比。</div>')+
 (d.unassignedMinutes?`<p class="form-note">另有 ${hours(d.unassignedMinutes)}h 未关联本周任务，保留在实际投入总量中。</p>`:''));
}

function daily(d){
 const cats=d.series, maximum=Math.max(60,...d.days.map(x=>x.totalMinutes)), maxHours=Math.ceil(maximum/60), ceiling=maxHours*60, bottom=192,height=150;
 let marks=[0,.5,1].map(v=>{const y=bottom-v*height;return `<line x1="36" y1="${y}" x2="350" y2="${y}" stroke="#e5ecf4"/><text x="29" y="${y+4}" text-anchor="end" fill="#68798f" font-size="11">${Number((v*maxHours).toFixed(1))}</text>`;}).join('');
 marks+='<text x="5" y="20" fill="#68798f" font-size="11">小时</text>';
 d.days.forEach((day,i)=>{const x=45+i*44;let y=bottom;cats.forEach(c=>{const m=day.minutes[c.id]||0,h=m/ceiling*height;if(m){y-=h;marks+=`<rect x="${x}" y="${y}" width="25" height="${h}" fill="${palette[c.id]}"><title>${day.date} ${esc(c.label)} ${hours(m)}小时</title></rect>`;}});marks+=`<text x="${x+12.5}" y="${bottom-day.totalMinutes/ceiling*height-7}" text-anchor="middle" fill="#253e5c" font-size="10">${hours(day.totalMinutes)}</text><text x="${x+12.5}" y="214" text-anchor="middle" fill="#68798f" font-size="11">${esc(day.dayLabel)}</text>`;});
 const legend=`<div class="chart-legend">${cats.map(c=>`<span><svg width="9" height="9" aria-hidden="true"><rect width="9" height="9" rx="2" fill="${palette[c.id]}"/></svg>${esc(c.label)}</span>`).join('')}</div>`;
 const table=`<details class="chart-values"><summary>查看每天的记录数值</summary><div class="chart-table-scroll"><table><caption>所选周的自主投入，单位：分钟</caption><thead><tr><th>日期</th>${cats.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th>合计</th></tr></thead><tbody>${d.days.map(day=>`<tr data-date="${day.date}"><th>${day.date}</th>${cats.map(c=>`<td>${day.minutes[c.id]||0}</td>`).join('')}<td>${day.totalMinutes}</td></tr>`).join('')}</tbody></table></div></details>`;
 return card('daily','本周每日自主投入','周一至周日，按实际发生日期汇总。只累计统一投入记录，不重复计算任务或旁听。',d.hasLogs?svg(marks,'周一至周日的任务实际投入堆叠条形图')+legend+table:empty);
}
function allocationPie(a){
 if(a.actualTotalMinutes<=0)return '';
 const parts=a.rows.filter(r=>r.actualMinutes>0),total=a.actualTotalMinutes;
 const shareLabel=share=>share>0&&share<0.1?'<0.1%':pct(share);
 const point=angle=>[100+88*Math.cos(angle),100+88*Math.sin(angle)].map(n=>Number(n.toFixed(6))).join(' ');
 let angle=-Math.PI/2;
 const slices=parts.map((r,i)=>{
  const share=r.actualMinutes/total*100,sweep=r.actualMinutes/total*Math.PI*2,end=i===parts.length-1?Math.PI*1.5:angle+sweep;
  const attrs=`class="pie-slice" data-slice-category="${esc(r.id)}" data-minutes="${r.actualMinutes}" data-percent="${share}" fill="${palette[r.id]}"`;
  const title=`<title>${esc(r.label)}：${r.actualMinutes}分钟，占已记录自主投入${esc(shareLabel(share))}</title>`;
  const mark=parts.length===1?`<circle ${attrs} cx="100" cy="100" r="88">${title}</circle>`:`<path ${attrs} d="M 100 100 L ${point(angle)} A 88 88 0 ${sweep>Math.PI?1:0} 1 ${point(end)} Z">${title}</path>`;
  angle=end;return mark;
 }).join('');
 const legend=parts.map(r=>{const share=r.actualMinutes/total*100;return `<li data-pie-category="${esc(r.id)}"><svg width="10" height="10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="${palette[r.id]}"/></svg><span>${esc(r.label)}</span><span class="pie-value"><b>${esc(shareLabel(share))}</b><small>${hours(r.actualMinutes)}h</small></span></li>`;}).join('');
 return `<figure class="allocation-pie-block"><figcaption>实际投入分布 · 饼图</figcaption><div class="pie-layout"><svg class="allocation-pie" data-testid="allocation-pie" data-total-minutes="${total}" viewBox="0 0 200 200" role="img" aria-label="本周已记录自主投入${hours(total)}小时，按专注内容统计，具体百分比与时长见旁边图例"><title>本周实际投入分布，共${hours(total)}小时</title>${slices}</svg><ul class="pie-legend" aria-label="实际投入饼图图例">${legend}</ul></div><p class="pie-note">计时投入使用开始时填写的内容；相同内容合并统计。只有确认实际投入后才计入。</p></figure>`;
}
function allocation(d){
 const a=d.allocation;
 const rows=a.rows.map(r=>`<div class="allocation-row" data-category="${esc(r.id)}" data-actual-percent="${r.actualPercent===null?'':r.actualPercent}"><div class="chart-row-label"><strong>${esc(r.label)}</strong><span>${hours(r.actualMinutes)}h · <b>${pct(r.actualPercent)}</b></span></div>${svg(`<rect x="0" y="4" width="360" height="8" rx="3" fill="#edf3fc"/><rect x="0" y="4" width="${(r.actualPercent||0)*3.6}" height="8" rx="3" fill="${palette[r.id]}"/>`,`${r.label}，实际投入${hours(r.actualMinutes)}小时，占${pct(r.actualPercent)}`,'0 0 360 16')}</div>`).join('');
 return card('allocation','本周专注内容分布',`本周已确认投入 ${hours(a.actualTotalMinutes)}h，看看时间花在了哪些具体内容上。`,d.hasLogs?allocationPie(a)+rows:empty);
}
root.TGDashboardView={render:data=>`<div class="dashboard-grid">${comparison(data)}${daily(data)}${allocation(data)}</div>`};
})(typeof globalThis!=='undefined'?globalThis:this);

</script>
<script>
/* Local, static learning aids. Never writes business data or controls the timer. */
window.TGLearningResources=(()=>{
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const template='我正在学【知识点】。原文/题目是【内容】。我的理解或尝试是【内容】。我卡在【具体位置】。请先给一个提示，不直接给完整答案；等我回答后再纠正。请标明需要回教材核对的结论。';
const cards=[
 {id:'scope',title:'不知道学什么、学到什么程度',tool:'教师 PPT＋最新教师要求',questions:['这一轮只学哪个知识点？','要求是解释、比较、计算，还是操作？','用哪道例题或练习验收？'],usage:'查看对应小节标题、定义和例题，确定本轮任务。',stop:'能说清“学什么＋完成标准”，就开始学习，不继续翻整套资料。',note:'旧年级复习材料不能当成本次考试范围的保证。'},
 {id:'textbook',title:'定义、公式条件或推导不清',tool:'教材',questions:['术语的准确含义是什么？','公式在什么条件下成立？','PPT 省略了哪一步？'],usage:'按目录查对应小节，补齐当前缺口，不从头通读。',stop:'能解释定义、适用条件或关键推导，再回到原题验证。'},
 {id:'gpt',title:'概念混淆、思路卡住或答案出错',tool:'GPT',questions:['我已理解到哪一步？','从哪一步开始不懂？','哪两个概念容易混淆？'],usage:'提供题目或原文，以及自己的理解或尝试，让 GPT 针对卡点解释、举反例、给提示或检查步骤。',stop:'能够独立解释或完成类似题，而不只是觉得回答看起来明白。',note:'GPT 的重要结论需核对教材或课件。',template},
 {id:'process',title:'文字看懂了，但想象不出动态过程',tool:'对应网课片段或过程图',questions:['数据、信号或指令怎样一步步变化？','哪个环节在脑中画不出来？','这一段视频具体要解决什么问题？'],usage:'带着一个问题看对应片段，中途暂停，自己画过程或预测下一步。',stop:'能够自行复述或画出过程，随后做题验证；不要求刷完整套课。',note:'如果连缺什么都说不清，先用 GPT 定位前置知识，而不是盲目刷课。'},
 {id:'verify',title:'感觉看懂了，但不确定是否真的会',tool:'纸笔＋教师例题或练习',questions:['关掉资料，我能讲清楚吗？','换一道类似题，我还能做吗？','错因是概念、条件、步骤，还是计算？'],usage:'独立作答后再核对；按错因返回对应工具。',stop:'满足本轮明确的完成标准。单次做对可记为“本轮通过”，不自动推断长期掌握；之后仍需回测。'},
 {id:'notes',title:'学完了，需要留下可复用的内容',tool:'纸上关键词＋一份电子主笔记',questions:['我自己的核心理解是什么？','哪个错因最值得留下？','下一次从哪里接着做？'],usage:'纸上只记关键理解、错因、待解决问题或必要推导；完整解释和来源整理到电子笔记。',stop:'下次能找到理解、例题和卡点即可，不为美化笔记延长学习。',note:'Space 可用于讨论，Obsidian 可用于最终归档。主笔记位置由你选择，不必两边同步维护。'}
];
const key='tplan.learning-resource-panel.v1';
let state={context:'',open:false,selected:'',step:'tool'},criterionText='';
function remember(){try{sessionStorage.setItem(key,JSON.stringify(state));}catch(_){/* Session-only UI still works without storage. */}}
function body(){
 const c=cards.find(c=>c.id===state.selected);
 return `<div class="card-head"><div><span class="tt-kicker">遇到问题，再调用工具</span><h2>学习资源调度</h2></div><button type="button" data-resource="${state.open?'close':'open'}" aria-expanded="${state.open}" aria-controls="lr-content">${state.open?'收起，返回学习':'我卡住了'}</button></div>
 ${state.open?`<div id="lr-content"><ol class="lr-steps" aria-label="使用步骤"><li><button type="button" data-resource="select" aria-current="${!c&&state.step!=='verify'?'step':'false'}">1 选择当前卡点</button></li><li><button type="button" data-resource="tool" aria-current="${c&&state.step!=='verify'?'step':'false'}">2 只用一个优先工具</button></li><li><button type="button" data-resource="verify" aria-current="${state.step==='verify'?'step':'false'}">3 独立验收</button></li></ol>
 ${state.step==='verify'?verification(c):c?`<article class="lr-tool"><div class="card-head"><span class="meta">${esc(c.title)}</span><button type="button" class="small" data-resource="back">← 改选卡点</button></div><span class="tt-kicker">优先工具</span><h3 tabindex="-1" id="lr-tool-title">${esc(c.tool)}</h3><div class="lr-tool-grid"><div><h4>带着一个问题</h4><ul>${c.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><p class="form-note">选与你有关的问题即可，不必逐项填写。</p></div><div><h4>具体怎么用</h4><p>${esc(c.usage)}</p>${c.note?`<p class="lr-caution">${esc(c.note)}</p>`:''}</div></div>${c.template?`<div class="lr-template"><div class="card-head"><h4>有明确问题时，复制后自行补充</h4><button type="button" data-resource="copy">复制提问模板</button></div><p>${esc(c.template)}</p><span class="form-note">仅复制到剪贴板，不发送笔记或打开外部工具。</span><span id="lr-copy-status" role="status" aria-live="polite"></span></div>`:''}<div class="lr-check"><h4>何时停下 · 独立验收</h4><p>${esc(c.stop)}</p><p class="form-note">对照本轮完成标准，合上资料自己讲、画或做一道题。收尾时记录成果 / 卡点与下一步，任务完成仍由你确认。</p></div></article>`:`<p class="muted">现在最需要解决哪一种问题？选一项即可。</p><div class="lr-choices">${cards.map((c,i)=>`<button type="button" data-resource="choose" data-card="${c.id}"><span class="lr-number">0${i+1}</span><span>${esc(c.title)}</span><span aria-hidden="true">↗</span></button>`).join('')}</div>`}
 <p class="form-note">工具卡不改变预算与收尾底线。到点后，沿用本轮收尾中的追加、拆小或暂缓。</p></div>`:'<p class="muted">选择当前卡点，找到一个优先工具，再靠自己验收。</p>'}
 <p class="lr-footer">不是“这个工具还没用”，而是“这个问题需要谁来解决”。</p>`;
}
function verification(c){const currentCriterion=document.querySelector('#tt-criterion')?.value??criterionText;return `<article class="lr-verification"><span class="tt-kicker">合上资料，让自己来试一次</span><h3 id="lr-verify-title" tabindex="-1">独立验收</h3><div class="lr-check"><h4>本轮完成标准</h4><p>${esc(currentCriterion||'本轮没有填写完成标准。先给自己一个能检验的小目标，例如独立做一道类似题，并解释每一步。')}</p></div><ol class="lr-verify-list"><li><b>先独立作答</b><p>收起资料与工具回答，用自己的话讲清楚、画出过程，或完成一道类似题。</p></li><li><b>再对照核验</b><p>对照本轮标准检查；如有错，分清是概念、条件、步骤还是计算，再返回对应工具。</p></li><li><b>留下这次结果</b><p>达到标准可在收尾时记为“本轮通过”；单次做对不代表长期掌握，之后仍需回测。未达到就沿用原来的卡点与下一步记录。</p></li></ol>${c?`<div class="lr-check"><h4>当前问题的停止条件</h4><p>${esc(c.stop)}</p></div>`:''}<p class="form-note">验收结果由你判断。打开这个步骤不会停止计时，也不会自动确认投入或完成任务。</p><div class="actions"><button type="button" data-resource="tool">${c?'返回工具卡':'选择一个卡点'}</button><button type="button" data-resource="return">返回计时与收尾</button></div></article>`;}
function render(context,criterion=''){
 criterionText=criterion;

 try{const saved=JSON.parse(sessionStorage.getItem(key));if(saved?.context===context)state={context,open:saved.open===true,selected:cards.some(c=>c.id===saved.selected)?saved.selected:'',step:saved.step==='verify'?'verify':'tool'};else state={context,open:false,selected:'',step:'tool'};}catch(_){if(state.context!==context)state={context,open:false,selected:'',step:'tool'};}
 return `<section class="card lr-panel" id="learning-resources" aria-label="学习资源调度">${body()}</section>`;
}
function update(focus){remember();const panel=document.querySelector('#learning-resources');if(panel){panel.innerHTML=body();panel.querySelector(focus)?.focus({preventScroll:true});}}
async function copy(){
 const status=document.querySelector('#lr-copy-status');
 try{
  try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(template);}
  catch(_){const input=document.createElement('textarea');input.value=template;input.className='lr-copy-buffer';input.setAttribute('aria-label','提问模板');document.body.append(input);input.select();try{if(!document.execCommand('copy'))throw new Error('Copy failed');}finally{input.remove();document.querySelector('[data-resource="copy"]')?.focus({preventScroll:true});}}
  if(status)status.textContent='已复制，粘贴后填写你的具体问题。';
 }catch(_){if(status)status.textContent='未能复制，请选中上方模板手动复制。';}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-resource]');if(!b)return;e.preventDefault();
 const action=b.dataset.resource;
 if(action==='copy'){copy();return;}
 if(action==='open')state.open=true;
 if(action==='close'||action==='return')state.open=false;
 if(action==='back'||action==='select'){state.selected='';state.step='tool';}
 if(action==='tool')state.step='tool';
 if(action==='verify')state.step='verify';
 if(action==='choose'){if(!cards.some(c=>c.id===b.dataset.card))return;state.selected=b.dataset.card;state.step='tool';}
 const outside=!b.closest('#learning-resources');
 update(action==='verify'?'#lr-verify-title':action==='choose'?'#lr-tool-title':action==='back'||action==='select'||action==='open'&&!state.selected?'[data-resource="choose"]':'[data-resource="'+(state.open?'close':'open')+'"]');
 if(action==='return'){document.querySelector('.tt-resource-entry button')?.focus({preventScroll:true});document.querySelector('.tt-focus')?.scrollIntoView({block:'start',behavior:'smooth'});}
 if(outside)document.querySelector('#learning-resources')?.scrollIntoView({block:'start',behavior:'smooth'});
});
return {render,reset(){state.open=false;state.selected='';state.step='tool';update();}};
})();

</script>
<script>

'use strict';
const T=window.TGTimer,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let host,announced='',failed=false;
function nativeMessage(data){if(window.chrome?.webview)window.chrome.webview.postMessage(JSON.stringify(data));}
function nativeSnapshot(b){const a=b.active,d=b.draft||defaults();nativeMessage({kind:'timer-state',sessionId:a?.id||'',phase:a?.phase||'ready',title:a?.title||d.title,remainingMs:a?(a.phase==='paused'?T.displayRemaining(a):a.remainingMs):d.minutes*60000,budgetMs:a?a.budgetMs:d.minutes*60000,cutoff:a?.cutoff||d.cutoff,at:Date.now()});}
const board=()=>host.state().timerBoard||T.empty();
const save=b=>{const s=JSON.parse(JSON.stringify(host.state()));s.timerBoard=b;host.persist(s);failed=false;nativeSnapshot(T.sync(b));};
function defaults(){return {title:'',taskId:'',minutes:25,energy:'medium',cutoff:null,cutoffMode:'manual',cutoffConfirmed:false};}
function setupDraft(b){const d=b.draft||defaults();return {...d,cutoff:d.cutoffConfirmed?d.cutoff:null};}
function render(){
 const b=T.sync(board()),a=b.active,d=setupDraft(b),today=date(Date.now()),rows=b.records.filter(r=>date(r.finishedAt)===today);
 const total=b.records.reduce((n,r)=>n+r.elapsedMs,0)+(a?a.elapsedMs:0);
 const tasks=host.state().tasks.filter(t=>t.status!=='done').sort((x,y)=>(y.date===today)-(x.date===today)||x.date.localeCompare(y.date));
 return `<header class="page-head tt-heading"><div><p class="eyebrow">给每一轮投入，留一个清楚的边界</p><h1>任务计时看板</h1><p class="muted">先拨时间与精力，再开始。到点看卡点，收尾不透支睡眠。</p></div>${mascot}<button class="tt-stats-entry" data-page="focus">专注统计 ↗</button></header>
 <div class="tt-stats"><div><span>今天已收尾</span><strong>${rows.length}<small> 轮</small></strong></div><div><span>累计计时参考</span><strong id="tt-total">${Math.floor(total/60000)}<small> 分钟</small></strong></div><div><span>这一轮的原则</span><p>时间到了，先停下来判断</p></div></div>
 <div class="tt-layout"><section class="card tt-focus"><div class="card-head"><span class="tt-kicker">${a?'本轮任务':'准备好，再出发'}</span><span class="badge" id="tt-phase">${a?{running:'专注进行中',paused:'已暂停',review:'等待收尾'}[a.phase]:'尚未开始'}</span></div>
 <h2 class="tt-task-title">${esc(a?.title||d.title||'这一轮，只推进一件事')}</h2>
 <div class="tt-dial"><svg viewBox="0 0 260 260" aria-hidden="true"><circle class="tt-track" cx="130" cy="130" r="115"/><circle id="tt-arc" class="tt-arc" cx="130" cy="130" r="115" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${a?100*(1-T.displayRemaining(a)/a.budgetMs):0}"/></svg><div class="tt-digits"><strong id="tt-clock">${clock(a?T.displayRemaining(a):d.minutes*60000)}</strong><span id="tt-caption">${a?(a.phase==='review'?'到这里，先做一次判断':a.phase==='paused'?'暂停计时，收尾底线继续生效':a.cutoff-Date.now()<a.remainingMs?'收尾底线先到 · 显示可用时间':'专注于眼前这一步'):'给它一段值得投入的时间'}</span></div></div>
 <p class="tt-focus-meta">${a?`${esc(energy[a.energy])} · 本轮预算 ${a.budgetMs/60000} 分钟`:'不求一口气做完，先拿到一点具体进展。'}</p>
 <div class="tt-controls">${a?(a.phase==='review'?'<span class="tt-review-hint">请在右侧完成本轮收尾 →</span>':button(a.phase==='paused'?'继续专注':'暂停一下',a.phase==='paused'?'resume':'pause','primary')+button('提前收尾','finish')):button('开始本轮专注','start','primary tt-start')}</div>
 <div class="tt-resource-entry"><button type="button" data-resource="open">我卡住了 · 调用工具</button></div><div class="tt-mini-row">${button('最小化为悬浮计时器','mini','tt-mini-button')}</div><p class="form-note">悬浮小窗置顶显示，可在其他应用上查看倒计时。离开前可先暂停。</p></section>
 <section class="card tt-budget">${a?.phase==='review'?review(a):a?running(a):setup(d,tasks)}</section></div>
 ${window.TGLearningResources.render(a?.id||'draft',a?.completionCriterion||d.completionCriterion||'')}
 <div class="tt-bottom"><section class="card"><div class="card-head"><h2>从待办里选一件</h2><span class="badge">${tasks.length} 项待推进</span></div><p class="form-note">沿用 T计划中的任务，计划与投入连在一起。</p><div class="tt-queue">${tasks.length?tasks.slice(0,6).map(t=>`<article><div><strong>${esc(t.title)}</strong><p class="meta">${t.date===today?'今天':esc(t.date)} · 预计 ${t.estimatedMinutes} 分钟</p></div>${button('选入本轮','pick','small',t.id)}</article>`).join(''):'<div class="tt-empty">先在“今日”或“本周”添加任务，<br>也可以直接在上方写下本轮目标。</div>'}</div></section>
 <section class="card tt-guide"><span class="tt-kicker">拨军粮 · 三个小约定</span><h2>投入有边界，<br>进展才更踏实。</h2><ol><li><b>时间</b><span>先约定这一轮给多少分钟。</span></li><li><b>精力</b><span>有余力攻难题，累了回顾熟悉内容。</span></li><li><b>底线</b><span>到点先记卡点，再决定下一步。</span></li></ol><p>已经花掉的时间，不是继续熬下去的理由。</p></section></div>
 <section class="card tt-history"><div class="card-head"><h2>专注与收尾记录</h2><small>保存在 T计划备份中 · 共 ${b.records.length} 轮</small></div><p class="form-note">计时供你参考。确认实际投入后才进入数据看板；任务完成状态由你单独确认。</p>${b.records.length?b.records.slice(0,100).map(r=>`<article class="tt-record"><div><span class="badge">${labels[r.decision]}</span><strong>${esc(r.title)}</strong><p class="meta">${time(r.finishedAt)} · 计时 ${clock(r.elapsedMs)} · ${esc(energy[r.energy])}</p>${r.completionCriterion?`<p class="text-line">本轮完成标准：${esc(r.completionCriterion)}</p>`:''}${r.blocker?`<p class="text-line">卡点：${esc(r.blocker)}</p>`:''}${r.next?`<p class="text-line">下一步：${esc(r.next)}</p>`:''}</div><div>${r.logId?'<span class="tt-recorded">已确认投入</span>':button('确认实际投入','log','small',r.id)}</div></article>`).join(''):'<div class="tt-empty">还没有收尾记录。<br><span>第一轮结束后，把进展和卡点留在这里。</span></div>'}${b.records.length>100?'<p class="form-note">显示最近100轮，完整记录随数据备份导出。</p>':''}</section>`;
}
function setup(d,tasks){return `<span class="tt-kicker">开始前 · 拨好这一轮军粮</span><h2>这件事，值得投入多少？</h2><form id="tt-setup" class="tt-form">
 <label for="tt-task">关联已有任务</label><select id="tt-task" name="taskId"><option value="">独立任务，不关联待办</option>${tasks.map(t=>`<option value="${esc(t.id)}" ${d.taskId===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select>
 <label for="tt-intent">专注类型（可选）</label><select id="tt-intent" name="intent"><option value="">暂不选择</option>${Object.entries(T.intents).map(([v,l])=>`<option value="${v}" ${d.intent===v?'selected':''}>${l}</option>`).join('')}</select><label for="tt-title">本轮只解决什么</label><input id="tt-title" name="title" value="${esc(d.title)}" placeholder="例如：弄懂共射放大电路的静态工作点" maxlength="150" required>
 <label for="tt-criterion">本轮完成标准（可选）</label><input id="tt-criterion" name="completionCriterion" value="${esc(d.completionCriterion||'')}" maxlength="500" placeholder="例如：独立完成两道子网题并解释错因"><p class="form-note">留一个能独立检验的结果即可，不必每轮填写。</p>
 <div class="tt-label"><label for="tt-minutes">01 / 时间预算</label><span>分钟</span></div><div class="tt-time-input"><input id="tt-minutes" name="minutes" type="number" min="1" max="180" step="1" value="${d.minutes}" required><div class="tt-presets">${[15,25,45,60].map(m=>button(m+'','preset','small',m)).join('')}</div></div>
 <label for="tt-energy">02 / 现在的精力</label><select id="tt-energy" name="energy">${Object.entries(energy).map(([v,l])=>`<option value="${v}" ${v===d.energy?'selected':''}>${l}</option>`).join('')}</select>
 <div class="tt-label tt-cutoff-label"><label for="tt-cutoff">03 / 最晚什么时候收尾</label>${button('按本轮预算设置','budget-cutoff','small')}</div><input id="tt-cutoff" name="cutoff" type="datetime-local" step="1" data-mode="${d.cutoffMode==='budget'?'budget':'manual'}" value="${d.cutoff===null?'':localPrecise(d.cutoff)}" required><p class="form-note">一键设置按开始时刻计算；手动修改后固定为所选时间。新任务不沿用上一轮底线。</p><p id="tt-cutoff-mode" class="form-note" role="status"></p><p id="tt-budget-warning" class="notice" role="status" hidden></p><p id="tt-error" class="form-error" role="alert"></p></form>`;}
function criterion(a){return a.completionCriterion?`<div class="tt-soft tt-criterion"><b>本轮完成标准</b><p>${esc(a.completionCriterion)}</p><span class="form-note">合上资料独立验收；看完提示或计时结束不代表任务完成。</span></div>`:'';}
function running(a){return `<span class="tt-kicker">${a.phase==='paused'?'稍作停顿，也在计划之内':'本轮预算已锁定'}</span><h2>把注意力交给这一件事</h2>${criterion(a)}<dl class="tt-contract"><div><dt>时间预算</dt><dd>${a.budgetMs/60000} <small>分钟</small></dd></div><div><dt>当前精力</dt><dd>${esc(energy[a.energy])}</dd></div><div><dt>必须收尾</dt><dd>${time(a.cutoff)}</dd></div></dl><p class="notice" id="tt-cutoff-note" ${a.cutoff-Date.now()<a.remainingMs?'':'hidden'}>收尾底线早于预算结束。倒计时显示距 ${time(a.cutoff)} 的可用时间；不会自动延长底线。</p><div class="tt-soft"><b>到点还没懂，也有下一步</b><p>留下具体卡点，选择有限追加、拆小或暂缓。</p></div><p class="form-note">已追加 ${a.extensionCount} 次 / ${a.extraMinutes} 分钟。追加最多3次、累计30分钟，并受收尾底线限制。</p>`;}
function review(a){return `<span class="tt-kicker">先停一停 · 看清下一步</span><h2>${a.reason==='cutoff'?'到收尾底线了，照顾好睡眠':a.reason==='budget'?'预算用完了，先做个判断':'为这一轮留个落点'}</h2><p class="form-note">本轮计时 ${clock(a.elapsedMs)}。没懂就记下具体卡点，别被已经花掉的时间绑住。</p>${criterion(a)}<form id="tt-review" class="tt-form"><label for="tt-blocker">具体卡点 / 本轮收获</label><textarea id="tt-blocker" name="blocker" maxlength="4000" placeholder="卡在哪个概念、步骤或条件？完成了什么？"></textarea><label for="tt-next">下一步只做什么</label><input id="tt-next" name="next" maxlength="150" placeholder="拆成一个可以验证的小问题"><label for="tt-quality">本轮专注质量（可选）</label><select id="tt-quality" name="quality"><option value="">暂不评分</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${n} 分 · ${['','很难投入','有些分心','一般','比较专注','非常专注'][n]}</option>`).join('')}</select><label for="tt-decision">这次如何收尾</label><select id="tt-decision" name="decision"><option value="done">本轮完成，结束计时</option><option value="split">拆小，准备下一轮</option><option value="defer">暂缓，留待状态合适时</option><option value="extend" ${Date.now()>=a.cutoff?'disabled':''}>有限追加（不越过底线）</option></select><div id="tt-extra" hidden><label for="tt-extra-minutes">追加分钟 · 单次最多15分钟</label><input id="tt-extra-minutes" name="minutes" type="number" min="1" max="15" value="5"></div>${button('保存这次判断','decide','primary')}<p id="tt-error" class="form-error" role="alert"></p></form>`;}
function readDraft(){const f=document.querySelector('#tt-setup');if(!f)return null;const p=Object.fromEntries(new FormData(f));return {...p,minutes:Number(p.minutes),cutoff:p.cutoff?new Date(p.cutoff).getTime():null,cutoffConfirmed:!!p.cutoff,cutoffMode:f.elements.cutoff.dataset.mode==='budget'?'budget':'manual'};}
function tick(){
 if(document.querySelector('#tt-setup'))budgetHint(readDraft());
 const b=board(),next=T.sync(b),a=next.active;
 if(b.active&&a.phase!==b.active.phase){try{save(next);host.refresh();if(announced!==a.id){announced=a.id;host.toast(a.reason==='cutoff'?'已到收尾底线，请记录卡点并结束。':'本轮时间到了，请回到任务计时看板收尾。');}}catch(e){if(!failed){failed=true;host.toast(e.message);}}}
 const idle=document.querySelector('#wb-idle-timer');if(idle)idle.hidden=!!a;const pill=document.querySelector('#tt-global');if(pill){pill.hidden=!a;pill.textContent=a?(a.phase==='review'?'本轮到点 · 去收尾':`${a.phase==='paused'?'已暂停':'专注中'} ${clock(T.displayRemaining(a))}`):'';}
 nativeSnapshot(next);
 if(!a){document.title='T计划';return;}
 const c=document.querySelector('#tt-clock');if(c)c.textContent=clock(T.displayRemaining(a));
 const caption=document.querySelector('#tt-caption');if(caption&&a.phase==='running')caption.textContent=a.cutoff-Date.now()<a.remainingMs?'收尾底线先到 · 显示可用时间':'专注于眼前这一步';
 const note=document.querySelector('#tt-cutoff-note');if(note)note.hidden=!(a.cutoff-Date.now()<a.remainingMs);
 const arc=document.querySelector('#tt-arc');if(arc)arc.setAttribute('stroke-dashoffset',String(100*(1-T.displayRemaining(a)/a.budgetMs)));
 const total=document.querySelector('#tt-total');if(total)total.innerHTML=Math.floor((next.records.reduce((n,r)=>n+r.elapsedMs,0)+a.elapsedMs)/60000)+'<small> 分钟</small>';
 document.title=a.phase==='review'?'该收尾了 · T计划':clock(T.displayRemaining(a))+' · T计划';
}
function init(h){host=h;const pill=document.createElement('button');pill.id='tt-global';pill.dataset.page='timer';pill.hidden=true;(document.querySelector('#wb-timer-slot')||document.body).append(pill);
 document.addEventListener('click',e=>{const b=e.target.closest('[data-timer]');if(!b)return;e.preventDefault();try{
  const action=b.dataset.timer,id=b.dataset.id;
  if(action==='start'){const f=document.querySelector('#tt-setup');if(!f)return;const draft=readDraft();if(draft.cutoff===null){document.querySelector('#tt-cutoff').focus();throw new Error('请为这个新任务重新设置收尾底线');}if(!f.reportValidity())return;save(T.start(board(),draft));host.refresh();}
  else if(['pause','resume','finish'].includes(action)){save(T.control(board(),action));host.refresh();}
  else if(action==='decide'){const f=document.querySelector('#tt-review');if(!f.reportValidity())return;save(T.decide(board(),Object.fromEntries(new FormData(f))));host.refresh();document.title='T计划';host.toast('本轮判断已保存。实际投入可在下方确认。');}
  else if(action==='preset'){document.querySelector('#tt-minutes').value=id;document.querySelector('#tt-clock').textContent=clock(Number(id)*60000);refreshBudgetPreview();keepDraft();}
  else if(action==='budget-cutoff'){const input=document.querySelector('#tt-minutes'),minutes=Number(input.value);if(!Number.isInteger(minutes)||minutes<1||minutes>180){input.focus();throw new Error('请先设置1—180分钟的本轮预算');}document.querySelector('#tt-cutoff').dataset.mode='budget';document.querySelector('#tt-cutoff').value=localPrecise(Date.now()+minutes*60000);document.querySelector('#tt-error').textContent='';keepDraft();document.querySelector('#tt-cutoff').focus();host.toast(`已选择按预算设置：点击开始时将重新计算，完整计时 ${minutes} 分钟。`);}
  else if(action==='pick'){if(board().active)throw new Error('请先收尾当前任务，再选择下一件事');const t=host.state().tasks.find(t=>t.id===id);if(!t)return;const next=JSON.parse(JSON.stringify(board()));next.draft={...(next.draft||defaults()),title:t.title,taskId:t.id,completionCriterion:'',cutoff:null,cutoffMode:'manual',cutoffConfirmed:false,minutes:Math.max(1,Math.min(180,t.estimatedMinutes||25))};save(next);window.TGLearningResources.reset();host.refresh();document.querySelector('#tt-title').focus();}
  else if(action==='log')host.log(id);
  else if(action==='mini'){if(window.chrome?.webview){nativeSnapshot(T.sync(board()));nativeMessage({kind:'timer-mini'});}else host.toast('悬浮置顶功能请在桌面版 T计划中使用。');}
  tick();
 }catch(err){const error=document.querySelector('#tt-error');if(error)error.textContent=err.message;host.toast(err.message);}});
 document.addEventListener('submit',e=>{if(['tt-setup','tt-review'].includes(e.target.id)){e.preventDefault();document.querySelector(`[data-timer="${e.target.id==='tt-setup'?'start':'decide'}"]`)?.click();}});
 document.addEventListener('input',e=>{if(e.target.id==='tt-criterion')keepDraft();if(e.target.id==='tt-cutoff'){e.target.dataset.mode='manual';keepDraft();}});
 document.addEventListener('change',e=>{if(e.target.id==='tt-cutoff')e.target.dataset.mode='manual';if(e.target.id==='tt-minutes')refreshBudgetPreview();if(e.target.id==='tt-decision')document.querySelector('#tt-extra').hidden=e.target.value!=='extend';if(e.target.closest('#tt-setup')){if(e.target.id==='tt-task'){window.TGLearningResources.reset();document.querySelector('#tt-criterion').value='';document.querySelector('#tt-cutoff').value='';document.querySelector('#tt-cutoff').dataset.mode='manual';const t=host.state().tasks.find(t=>t.id===e.target.value);if(t){document.querySelector('#tt-title').value=t.title;document.querySelector('#tt-minutes').value=Math.max(1,Math.min(180,t.estimatedMinutes||25));}}keepDraft();}});
 if(window.chrome?.webview)window.chrome.webview.addEventListener('message',e=>{try{if(e.data==='timer:show'){host.open();tick();}else if(e.data==='timer:pause'||e.data==='timer:resume'){save(T.control(board(),e.data.slice(6)));host.refresh();tick();}}catch(err){host.toast(err.message);nativeSnapshot(T.sync(board()));}});
 setInterval(tick,500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});tick();
}
function refreshBudgetPreview(){const cutoff=document.querySelector('#tt-cutoff'),minutes=Number(document.querySelector('#tt-minutes')?.value);if(cutoff?.dataset.mode==='budget'&&Number.isInteger(minutes)&&minutes>=1&&minutes<=180)cutoff.value=localPrecise(Date.now()+minutes*60000);}
function budgetHint(d){if(!d)return;const mode=document.querySelector('#tt-cutoff-mode');if(mode)mode.textContent=d.cutoffMode==='budget'?`按预算：开始时重新计算 ${d.minutes} 分钟。上方时间仅为预览。`:d.cutoff===null?'请为本轮设置收尾底线。':'固定时间：开始时保持不变。';const e=document.querySelector('#tt-budget-warning');if(!e)return;const left=d?.cutoff===null?null:d.cutoff-Date.now();e.hidden=d.cutoffMode==='budget'||left===null||!Number.isFinite(left)||left>=d.minutes*60000-60000;e.textContent=left<=0?'所选收尾底线已经过去，请重新设置。':`预算是 ${d.minutes} 分钟，但距离收尾底线只剩约 ${Math.ceil(left/60000)} 分钟，请开始前检查。`;}
function keepDraft(){const d=readDraft();budgetHint(d);if(!d||(d.cutoff!==null&&!Number.isFinite(d.cutoff))||!Number.isInteger(d.minutes)||d.minutes<1||d.minutes>180)return;try{const b=JSON.parse(JSON.stringify(board()));b.draft=d;save(T.validate(b));const c=document.querySelector('#tt-clock');if(c)c.textContent=clock(d.minutes*60000);}catch(e){host.toast('设置未保存：'+e.message);}}
function prepare(taskId,criterion=''){if(board().active)throw new Error('请先收尾当前计时，再准备地图中的下一件事');const t=host.state().tasks.find(t=>t.id===taskId);if(!t)throw new Error('任务已删除，历史地图仍保留');const next=JSON.parse(JSON.stringify(board()));next.draft={...defaults(),title:t.title,taskId:t.id,completionCriterion:criterion,minutes:Math.max(1,Math.min(180,t.estimatedMinutes||25)),cutoff:null,cutoffMode:'manual',cutoffConfirmed:false};save(next);window.TGLearningResources.reset();host.open();tick();}
return {init,render,clock,prepare};
})();

</script>
<script>
/* Focus statistics use saved timer rounds, never add them to the effort ledger. */
(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory(require('./core'),require('./task-timer'));else root.TGFocusStats=factory(root.TG,root.TGTimer);})(typeof globalThis!=='undefined'?globalThis:this,(G,T)=>{
'use strict';
const ranges={today:1,'7d':7,'30d':30};
const date=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n.toFixed(1)).toLocaleString('zh-CN');
function build(state,range='7d',now=Date.now()){
 G.validateState(state);if(!Object.hasOwn(ranges,range)||!Number.isFinite(now))throw new Error('专注统计范围无效');
 const end=date(now),start=G.addDays(end,1-ranges[range]);
 const records=(state.timerBoard?.records||[]).filter(r=>r.finishedAt<=now&&date(r.finishedAt)>=start&&date(r.finishedAt)<=end).slice().sort((a,b)=>b.finishedAt-a.finishedAt);
 const days=Array.from({length:ranges[range]},(_,i)=>({date:G.addDays(start,i),minutes:0,count:0})),byDay=new Map(days.map(d=>[d.date,d]));

 for(const r of records){const d=byDay.get(date(r.finishedAt));d.minutes+=r.elapsedMs/60000;d.count++;totalMs+=r.elapsedMs;pauses+=r.pauseCount||0;if(r.pauseTrackingComplete!==true)pauseUnknown++;

function trend(d,key,label,color){const max=Math.max(1,...d.days.map(x=>x[key])),top=22,bottom=160,left=38,width=530,step=width/d.days.length;
 let marks=[0,.5,1].map(n=>`<line x1="38" y1="${bottom-n*(bottom-top)}" x2="568" y2="${bottom-n*(bottom-top)}" stroke="#e4edf9"/><text x="30" y="${bottom-n*(bottom-top)+4}" text-anchor="end">${fmt(max*n)}</text>`).join('');
 d.days.forEach((x,i)=>{const h=x[key]/max*(bottom-top),xpos=left+i*step+step*.2;marks+=`<rect x="${xpos}" y="${bottom-h}" width="${Math.max(2,step*.6)}" height="${h}" rx="3" fill="${color}"><title>${x.date}：${fmt(x[key])}${label}</title></rect>`;if(d.days.length<=7||i%5===0||i===d.days.length-1)marks+=`<text x="${left+(i+.5)*step}" y="183" text-anchor="middle">${x.date.slice(5)}</text>`;});

function bars(items,total,unit,key){return items.length?items.map(x=>`<div class="fs-bar"><div><strong>${esc(x.label)}</strong><span>${fmt(x[key])} ${unit}</span></div><progress max="${Math.max(1,total)}" value="${x[key]}" aria-label="${esc(x.label)} ${fmt(x[key])}${unit}"></progress></div>`).join(''):'<p class="empty">这个区间还没有已收尾的专注记录。</p>';}

 <p class="form-note">${d.start} — ${d.end} · 按收尾日期统计，跨日的一轮计入收尾日。统计已保存轮次，正在计时与待收尾不计入。</p>

 <div class="fs-two section"><section class="card"><h2>时间花在哪些内容上</h2><p class="form-note">沿用每轮开始时填写的内容，同名合并。</p>${bars(d.contents.slice(0,12),d.totalMinutes,'分钟','minutes')}${d.contents.length>12?`<details><summary>查看其余 ${d.contents.length-12} 项内容</summary>${bars(d.contents.slice(12),d.totalMinutes,'分钟','minutes')}</details>`:''}</section>
 <section class="card"><h2>做的是哪类事</h2><p class="form-note">开始前可选类型，未选择的记录单独保留。</p>${bars(d.types,d.count,'轮','count')}</section>
 <section class="card"><h2>专注质量分布</h2><p class="form-note">收尾时可自评1—5分。已评分 ${d.rated} 轮，未评分 ${d.unrated} 轮。</p>${d.rated?bars(d.quality.map(q=>({label:'★'.repeat(q.score),count:q.count})),d.rated,'轮','count'):'<p class="empty">还没有评分。下一轮收尾时可以留下感受。</p>'}</section>
 <section class="card fs-guide"><h2>怎么读这些数</h2><p>单轮长短受任务难度、预算和收尾底线影响，可以结合当轮卡点一起看。</p><p>暂停次数只表示你点了暂停；评分是个人感受，都不等同于掌握程度。</p><p>这里使用计时记录，已扣除暂停时间；“数据看板”使用你确认的实际投入，两者不会自动累加。</p><button data-page="dashboard">查看实际投入看板</button></section></div>
 <section class="card"><div class="card-head"><h2>本区间的专注记录</h2><small>最近 ${Math.min(30,d.count)} / ${d.count} 轮</small></div>${d.records.slice(0,30).map(r=>`<article class="fs-record"><div><strong>${esc(r.title)}</strong><p class="meta">${date(r.finishedAt)} · ${T.intents[r.intent]||'未记录类型'} · ${r.quality?'自评 '+r.quality+' / 5':'未评分'}</p></div><span>${fmt(r.elapsedMs/60000)} 分钟</span></article>`).join('')||'<p class="empty">完成一轮计时并保存收尾后，这里就会出现记录。</p>'}</section>`;

return {build,render,heatmap};

function editorAction(a,b){

 }

<script>
/* 快速添加：把输入框里的一句话拆成任务字段。只识别句子里明确写出的日期、时长和分类关键词；

(function(r,f){if(typeof module==='object'&&module.exports)module.exports=f();else r.TGQuickAdd=f();})(typeof globalThis!=='undefined'?globalThis:this,()=>{
'use strict';
const DAY=86400000,pad=n=>String(n).padStart(2,'0');

const WEEKDAY={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7,'天':7};
const RELATIVE={'今天':0,'今晚':0,'明天':1,'明晚':1,'后天':2,'大后天':3};

const SEP='[\\s,，。、;；:：!！?？]';

const CN='[零〇一二两三四五六七八九十]{1,3}';

 if(hit)return {...hit,date:addDays(today,RELATIVE[hit.groups[0]])};

function parse(text,today,options={}){

});

function courseSession(key){
 const [date,courseId]=key.split('|'),week=G.teachingWeek(date),course=C.forWeek(week).find(c=>c.id===courseId)||C.courses.find(c=>c.id===courseId);
 if(!course||!course.weeks.includes(week)||G.addDays(G.weekStart(date),course.day-1)!==date)throw new Error('找不到这一次课程，请从对应日期的课表打开。');
 const saved=G.getCoursePlan(state,courseId,date);
 return {course,date,week,saved,plan:saved||{courseId,week,date,topic:'',preQuestions:[],minimumGoals:[],standardGoals:[],stretchGoals:[],evidence:[],reflection:'',unresolvedProblem:'',levelReached:'unreviewed'}};
}
function hasLearningGoals(p){return p&&(p.topic.trim()||p.preQuestions.length||p.minimumGoals.length||p.standardGoals.length||p.stretchGoals.length);}
function learningBadge(courseId,date){const p=G.getCoursePlan(state,courseId,date),blocked=p&&(p.levelReached==='blocked'||p.evidence.includes('stuck')||p.unresolvedProblem.trim());const label=blocked?'存在卡点':p&&p.levelReached!=='unreviewed'?{minimum:'保底完成',standard:'达标完成',stretch:'进阶完成'}[p.levelReached]:hasLearningGoals(p)?'尚未复盘':p&&(p.reflection.trim()||p.evidence.length)?'已记成果':'尚未规划';return `<span class="learning-badge ${blocked?'has-question':''}" data-learning-status="${p?.levelReached||'unplanned'}">${label}</span>`;}
function learningTaskLink(t){const p=t.coursePlanId&&state.courseLearningPlans.find(p=>p.id===t.coursePlanId);return p?`<p class="meta course-task-link">${btn('关联课程：'+esc(C.courses.find(c=>c.id===p.courseId).name)+' · '+p.date,'course-history-open',p.id,'quiet small')}</p>`:'';}
function learningList(items){return items.length?`<ul class="learning-list">${items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="muted">尚未填写</p>';}
function courseTitle(c){return c.displayName||c.name;}
function scheduleBadge(c){return c.attendanceStatus==='occupied'?`<span class="badge warm" title="${esc(c.attendanceNotice)}">${esc(c.statusLabel)} · 上实验课</span>`:'';}
function courseDetail(key,activeTab='plan'){
 const {course:c,date,week,plan:p,saved}=courseSession(key),task=saved&&state.tasks.find(t=>t.coursePlanId===saved.id);
 modal('课程详情',`<div data-course-session="${esc(key)}"><header class="course-detail-hero"><h3>${esc(courseTitle(c))}</h3>${c.formalName?`<p class="form-note">正式名称：${esc(c.formalName)}</p>`:''}${scheduleBadge(c)}<p>${uiIcon('person')}${esc(c.teacher)} · ${esc(c.room)}</p><p>${uiIcon('calendar')}${date} · 第${week}教学周 · 周${weekdays[c.day-1]} · ${c.slot*2-1}–${c.slot*2}节</p><p class="form-note">课程开课周：${c.weeks.join('、')}</p>${c.notice?`<p class="notice">${esc(c.notice)}</p>`:""}${learningBadge(c.id,date)}</header>${courseNotice(date)}
 <div class="course-tabs" role="tablist" aria-label="课程详情内容">${[['plan','学习计划'],['record','课堂记录'],['tasks','相关任务']].map(([tab,label])=>`<button type="button" role="tab" id="course-tab-${tab}" aria-controls="course-panel-${tab}" aria-selected="${tab===activeTab}" tabindex="${tab===activeTab?0:-1}" data-action="course-tab" data-tab="${tab}" data-id="${esc(key)}" class="${tab===activeTab?'active':''}">${label}</button>`).join('')}</div>
 <section class="learning-section course-panel" id="course-panel-plan" role="tabpanel" aria-labelledby="course-tab-plan" ${activeTab!=='plan'?'hidden':''}><div class="card-head"><h3>本节学习计划</h3>${btn('编辑学习计划 · 流程画布','course-flow',key,'small primary')}${btn('简表编辑','course-plan-edit',key,'small')}</div>${hasLearningGoals(p)?`${p.topic?`<div class="topic-block"><h4>本节主题</h4><p class="learning-topic">${esc(p.topic)}</p></div>`:''}<h4>课前问题</h4>${learningList(p.preQuestions)}<div class="learning-line minimum"><h4>保底线 · 最少拿走什么</h4>${learningList(p.minimumGoals)}</div><div class="learning-line standard"><h4>达标线 · 本节主要目标</h4>${learningList(p.standardGoals)}</div><div class="learning-line stretch"><h4>进阶线 · 时间与状态允许时</h4>${learningList(p.stretchGoals)}</div>`:'<div class="course-plan-empty"><p class="empty">本节尚未制定学习目标。</p><p>带着一个问题走进课堂，留下自己的理解。</p></div>'}<p class="form-note">进阶线可留空，不要求完成。课程内容由你填写，不自动推测章节。</p><div class="actions section-gap">${btn('复制本节课程给ChatGPT','course-copy',key,'small')}</div></section>
 <section class="learning-section course-panel" id="course-panel-record" role="tabpanel" aria-labelledby="course-tab-record" ${activeTab!=='record'?'hidden':''}><div class="card-head"><h3>本次课堂学习记录</h3>${btn('记录本次学习','course-reflect',key,'small primary')}</div><p class="meta">自评：${learningLevels[p.levelReached]} · 自评与学习证据分别保留</p><h4>本次实际完成 / 学会的内容</h4><p class="text-line record-content">${esc(p.reflection||'尚未记录。可以写今天学了什么、完成哪道题，以及你自己的解释。')}</p><h4>学习证据</h4>${learningList(p.evidence.map(k=>learningEvidence[k]))}<h4>本节最大问题 / 卡点</h4><p class="text-line record-content">${esc(p.unresolvedProblem||'尚未填写')}</p><p class="form-note">听过、花过时间不自动代表掌握。保存本节记录不会增加自主投入时长。</p>${saved?`<div class="actions section-gap">${btn('复制本次学习记录','course-copy-record',saved.id,'small')}</div>`:''}</section>
 <section class="learning-section course-panel" id="course-panel-tasks" role="tabpanel" aria-labelledby="course-tab-tasks" ${activeTab!=='tasks'?'hidden':''}><div class="card-head"><h3>相关任务</h3></div>${task?`<article class="related-task"><span class="badge">${statusLabel[task.status]}</span><h4>${esc(task.title)}</h4><p class="meta">${task.date} · 预计 ${task.estimatedMinutes} 分钟 · 已记录 ${G.taskMinutes(state,task.id)} 分钟</p></article>`:'<p class="empty">这节课还没有关联的课后复盘任务。</p>'}${saved?btn(task?'查看课后复盘任务':'创建课后复盘任务','course-review-task',saved.id,'primary course-task-button'):'<p class="form-note">保存学习计划或本次学习记录后，可以创建关联的课后复盘任务。</p>'}<p class="form-note">课堂是固定时间；课后的实际投入按发生日期单独记录。</p></section>
 ${c.optional?optionalCard(C.optionalForWeek(week).find(x=>x.id===c.id),date,true):''}</div>`);
 dialog.classList.add('course-dialog');
}
function activateCourseTab(tab,focus=false){if(!['plan','record','tasks'].includes(tab))return;dialog.querySelectorAll('[data-action="course-tab"]').forEach(button=>{const active=button.dataset.tab===tab;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1;if(active&&focus)button.focus();});dialog.querySelectorAll('.course-panel').forEach(panel=>panel.hidden=panel.id!=='course-panel-'+tab);}
function learningArea(label,name,value,max=10000){return `<div class="field full"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" maxlength="${max}">${esc(value)}</textarea></div>`;}
function courseLearningForm(key,reflectionOnly=false){
 const {course:c,date,week,plan:p}=courseSession(key),hidden=`<input type="hidden" name="session" value="${esc(key)}"><p class="form-note">${esc(c.name)} · ${date} · 第${week}教学周</p>`;
 const body=reflectionOnly?`${learningArea('本次实际完成 / 学会的内容','reflection',p.reflection)}<fieldset class="learning-checks"><legend>本节学习证据（可独立勾选）</legend>${Object.entries(learningEvidence).map(([v,label])=>`<label class="check"><input type="checkbox" name="evidence" value="${v}" ${p.evidence.includes(v)?'checked':''}>${label}</label>`).join('')}</fieldset>${learningArea('本节最大问题 / 卡点','unresolvedProblem',p.unresolvedProblem)}${select('本节自评状态','levelReached',Object.entries(learningLevels),p.levelReached)}<p class="form-note">你可以只记成果或卡点，不必先写计划。达到保底不会自动升级为达标；未完成进阶没有失败评价。</p>`:
 `${input('本节主题','topic',p.topic,'text','maxlength="500"')}<p class="form-note">以下每行填写一项，可留空。建议保底1—3项、达标3—6项，进阶可选。</p>${learningArea('课前问题（每行一项）','preQuestions',p.preQuestions.join('\n'),51000)}${learningArea('保底线（每行一项）','minimumGoals',p.minimumGoals.join('\n'),51000)}${learningArea('达标线（每行一项）','standardGoals',p.standardGoals.join('\n'),51000)}${learningArea('进阶线（可选，每行一项）','stretchGoals',p.stretchGoals.join('\n'),51000)}`;
 modal(reflectionOnly?'记录本次学习':'编辑本节学习计划',hidden+`<div class="learning-form">${body}</div>${!reflectionOnly?'<button type="submit" name="openCanvas" value="1">保存并进入流程画布</button>':''}`,reflectionOnly?'course-reflection':'course-plan');
}
function courseHistory(){
 const all=state.courseLearningPlans.slice().sort((a,b)=>b.date.localeCompare(a.date)||C.courses.find(c=>c.id===a.courseId).slot-C.courses.find(c=>c.id===b.courseId).slot),names=[...new Set(all.map(p=>C.courses.find(c=>c.id===p.courseId).name))];
 if(!names.includes(courseHistoryFilter))courseHistoryFilter='';
 const rows=all.filter(p=>!courseHistoryFilter||C.courses.find(c=>c.id===p.courseId).name===courseHistoryFilter);
 return `<section class="card section" id="course-learning-history"><div class="card-head"><h2>课程学习记录</h2><small>按每次上课独立保存</small></div><p class="form-note">从今日课程或本周课表打开课程，记录本次完成内容。这里保留计划、成果与卡点，便于以后查找和复盘。</p>${all.length?`<div class="filters"><label for="course-history-filter">按课程筛选</label><select id="course-history-filter" aria-label="按课程筛选"><option value="">全部课程</option>${names.map(n=>`<option value="${esc(n)}" ${n===courseHistoryFilter?'selected':''}>${esc(n)}</option>`).join('')}</select><small>共 ${rows.length} 次</small></div>${rows.map(p=>{const c=C.courses.find(c=>c.id===p.courseId);return `<article class="course-history-row" data-course-plan-id="${esc(p.id)}"><div class="card-head"><h3>${esc(c.name)}</h3>${learningBadge(p.courseId,p.date)}</div><p class="meta">${p.date} · 第${p.week}教学周 · 周${weekdays[c.day-1]} ${c.slot*2-1}–${c.slot*2}节</p>${p.topic?`<p class="learning-topic">${esc(p.topic)}</p>`:''}<p class="text-line learning-preview">${esc(p.reflection||'尚未填写本次实际完成内容')}</p>${p.unresolvedProblem?`<p class="text-line learning-preview">卡点：${esc(p.unresolvedProblem)}</p>`:''}<div class="actions">${btn('查看 / 编辑','course-history-open',p.id,'small')}${btn('复制本次学习记录','course-copy-record',p.id,'small')}</div></article>`;}).join('')}`:'<p class="empty">还没有课程学习记录。</p>'}</section>`;
}
function learningFacts(){const s=G.courseLearningStats(state,selected,new Date().toISOString());return `<section class="card section" data-testid="course-learning-facts"><div class="card-head"><h2>本周课程复盘</h2><small>仅统计已发生课程</small></div><div class="learning-facts">${[['已复盘',s.reviewedCount,'reviewed'],['自评保底',s.minimumCount,'minimum'],['自评达标',s.standardCount,'standard'],['有卡点',s.blockedCount,'blocked']].map(([label,value,id])=>`<div><small>${label}</small><strong data-learning-count="${id}">${value}<small> 次</small></strong></div>`).join('')}</div><p class="form-note">填写成果、证据、卡点或自评后计为已复盘。三档自评分别计数，不自动升级；卡点可同时存在，不计算掌握率。</p></section>`;}
function copyCourseText(){const t=document.querySelector('#course-copy-text');t.focus();t.select();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('已复制，由你决定是否发送给ChatGPT')).catch(()=>toast('文本已选中，可按 Ctrl+C 或长按复制'));else{try{toast(document.execCommand('copy')?'已复制':'文本已选中，可按 Ctrl+C 或长按复制');}catch(e){toast('文本已选中，可按 Ctrl+C 或长按复制');}}}
function courseCopy(title,text){modal(title,`<p class="form-note">仅生成本地文本，不向任何服务发送。复制失败时可直接选择下方文字。</p><textarea id="course-copy-text" class="review-text" aria-label="课程复制文本" readonly>${esc(text)}</textarea><div class="dialog-actions">${btn('复制文本','copy-course-text','','primary')}</div>`);copyCourseText();}
function coursePrompt(key){const {course:c,date,week,plan:p,saved}=courseSession(key);return `【课程】\n${c.name}\n【教学周】\n第${week}周\n【本节时间】\n${date} 周${weekdays[c.day-1]} ${c.slot*2-1}–${c.slot*2}节\n【本节主题】\n${p.topic||'尚未填写，请先询问我本节讲授内容'}\n\n${saved?G.courseLearningText(state,saved.id)+'\n\n':''}请根据我提供的本节内容，帮我制定：\n1. 课前需要知道什么\n2. 本节最重要的问题\n3. 保底学习目标\n4. 达标学习目标\n5. 进阶学习目标（可选）\n6. 如何验证自己是否真正掌握\n\n不要把所有知识都列成重点。若主题、教材或课堂内容不足，请先向我确认，不要编造老师讲授的章节。若已有本次成果和卡点，请先据此复盘，再建议下一步。`;}
function errorBanner(message){const e=document.querySelector('#storage-error');e.hidden=false;e.textContent=message;}
function toast(message){const e=document.querySelector('#status');e.textContent=message;e.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.hidden=true,4200);}
try {lastRaw=localStorage.getItem(KEY);state=lastRaw?G.upgradeState(JSON.parse(lastRaw)):G.newState();G.validateState(state);}
catch(e){state=G.newState();blocked=true;errorBanner('本机数据无法读取。已停止写入，请从数据管理导出原始数据或导入有效备份。');}
function persist(next, recovery=false){
 if(blocked&&!recovery) throw new Error('当前存储不可写，请先在数据管理恢复有效备份。');
 if(!recovery&&localStorage.getItem(KEY)!==lastRaw) throw new Error('另一窗口已更新数据。请刷新此页后再操作，避免覆盖。');
 G.validateState(next);const raw=JSON.stringify(next);localStorage.setItem(KEY,raw);lastRaw=raw;state=next;blocked=false;
 document.querySelector('#storage-error').hidden=true;
}
function change(action,payload){const next=clone(state);G.mutate(next,action,payload);persist(next);}
function safe(fn){try{fn();}catch(e){toast(e.message);if(/quota|storage|存储|窗口|写入/i.test(e.message))errorBanner('保存失败，刚才的修改未写入：'+e.message);}}
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null)errorBanner('另一窗口的数据已变化。请刷新后继续，以免覆盖。');});
function heading(title,sub,actions=''){return `<header class="page-head"><div><h1>${title}</h1><p class="muted">${sub}</p></div><div class="header-actions">${actions}${btn('数据','data','','small data-link-mobile')}</div></header>`;}
function weekLabel(date){const w=G.teachingWeek(date);return w<1?'教学周尚未开始':w>20?'本学期已结束':`第 ${w} 教学周 / 共20周`;}
function weekPicker(){return `<div class="week-switch">${btn('‹','prev-week','','small')}<label>第 <input aria-label="教学周" id="week-number" type="number" min="1" max="20" value="${Math.max(1,Math.min(20,G.teachingWeek(selected)))}"> 周</label>${btn('›','next-week','','small')}${btn('回到本周','current-week','','small')}<small>${selected} — ${G.addDays(selected,6)}</small></div>`;}
function taskCard(t,main=false){return `<div class="${main?'hero-task':'task-row'}" data-task-id="${esc(t.id)}" ${main?'data-testid="main-task"':'data-testid="secondary-task"'}>
 ${main?`<span class="badge">今日主任务${t.status==='done'?' · 已完成':''}</span>`:''}<h3>${esc(t.title)}</h3>
 <p class="meta">${esc(cat(t.category))} · 预计 ${t.estimatedMinutes} 分钟 · 已投入 ${G.taskMinutes(state,t.id)} 分钟 · ${statusLabel[t.status]}</p>
 ${learningTaskLink(t)}${t.evidence?`<p class="evidence">完成证据 / 卡点：${esc(t.evidence)}</p>`:''}
 <div class="actions">${t.status!=='done'?btn('完成','complete',t.id,'small primary'):''}${btn('记投入','log',t.id,'small')}${btn('流程编排','task-map',t.id,'small')}${btn('编辑','task-edit',t.id,'small')}${t.status!=='done'?btn('延期到明天','postpone',t.id,'small'):''}</div></div>`;}
function progressCards(stats){return stats.comparison.length?`<div class="goals">${stats.comparison.map(t=>{
 const percent=t.targetMinutes>0?t.actualMinutes/t.targetMinutes*100:null;
 return `<div class="goal" data-task-progress="${esc(t.id)}"><p class="goal-name">${esc(t.label)}</p><p class="goal-amount">${fmt(t.actualMinutes)}<small> / ${fmt(t.targetMinutes)}h</small></p><progress aria-label="${esc(t.label)}投入进度" max="100" value="${percent===null?0:Math.min(100,percent)}"></progress><p class="goal-note">${statusLabel[t.status]} · ${percent===null?'未设预计时长':Math.round(percent)+'% 已投入'}${percent>100?' · 超出预计':''}</p></div>`;
 }).join('')}</div><p class="form-note">按当前安排在本周的任务统计；进度条表示实际投入 / 预计耗时，任务完成以你确认的状态为准。</p>`:'<p class="empty">本周还没有安排任务。新建任务后，这里会显示你的任务和投入进度。</p>';}
function optionalCard(c,date,insideDetail=false){const a=state.attendance.find(x=>x.date===date&&x.courseId===c.id);return `<div class="optional"><div class="actions"><span class="badge warm">可选旁听</span><strong>${esc(c.name)}</strong>${!insideDetail?btn("学习计划 / 记录","course-open",date+"|"+c.id,"small"):""}</div><p class="meta">${date} · ${(c.slot-1)*2+1}–${c.slot*2}节 · ${esc(c.room)} · ${esc(c.teacher)}</p>${courseNotice(date)}${c.warning?`<p class="notice">${esc(c.warning)}</p>`:''}${c.conflict?`<p class="muted">与${esc(c.conflictNames.join('、'))}冲突，正式课优先。</p>`:`<div class="actions">${a?`<span class="badge">${a.attended?'已参加':'计划参加'} · 预留${a.plannedMinutes}分钟</span>`:''}${!a?.attended?btn(a?'调整计划':'计划参加','attendance-plan',date+'|'+c.id,'small'):''}${btn(a?.attended?'编辑投入':'记录参加','attendance-attend',date+'|'+c.id,'small')}${a?btn(a.attended?'取消时间预留':'取消计划','attendance-cancel',date+'|'+c.id,'small'):''}</div>`}</div>`;}
function workbenchMetrics(d,formal){
 const tasks=state.tasks.filter(t=>t.date===d),done=tasks.filter(t=>t.status==='done').length;
 const minutes=state.logs.filter(l=>l.date===d).reduce((n,l)=>n+l.minutes,0);
 const rounds=(state.timerBoard?.records||[]).filter(r=>{const t=new Date(r.finishedAt);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')===d;});
 const courses=formal.filter(c=>!['occupied','excused'].includes(c.attendanceStatus)).length;
 return `<section class="wb-metrics section" aria-label="今日概览"><button class="wb-metric" data-action="all-tasks"><span class="wb-metric-name">${uiIcon('target')}今日任务</span><strong>${done}<small> / ${tasks.length} 项</small></strong><span>已完成 / 今日安排</span></button><button class="wb-metric" data-page="records"><span class="wb-metric-name">${uiIcon('book')}已确认投入</span><strong>${minutes}<small> 分钟</small></strong><span>按今天的实际投入记录</span></button><button class="wb-metric" data-page="focus"><span class="wb-metric-name">${uiIcon('person')}已收尾专注</span><strong>${rounds.length}<small> 轮</small></strong><span>计时记录 · 不代表任务完成</span></button><button class="wb-metric" data-action="go-schedule"><span class="wb-metric-name">${uiIcon('calendar')}今日课程</span><strong>${courses}<small> 堂</small></strong><span>按现有课表需参加的课程</span></button></section>`;
