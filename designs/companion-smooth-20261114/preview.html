<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>橙橙 · 动作过渡预览</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f4f1;color:#292929;font:15px/1.75 "Microsoft YaHei UI",sans-serif}main{max-width:1000px;margin:auto;display:grid;grid-template-columns:minmax(260px,1fr) 340px;align-items:center;gap:36px}h1{font-size:28px;margin:8px 0}p{color:#727272}.stage{border:1px solid #dad6cf;border-radius:24px;overflow:hidden;background:repeating-conic-gradient(#eee 0 25%,#fafafa 0 50%) 50%/24px 24px}.stage.dark{background:#252525}canvas{width:100%;height:auto;max-height:82vh;object-fit:contain;display:block}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button{font:inherit;padding:8px 13px;border:1px solid #d2cec5;border-radius:10px;background:white;color:#282828;cursor:pointer}button.on{background:#292929;color:white;border-color:#292929}label{display:block;margin:14px 0}small,output{color:#747474}output{display:block;font-variant-numeric:tabular-nums;margin:16px 0}a{color:inherit}@media(max-width:700px){body{padding:16px}main{grid-template-columns:1fr;gap:12px}canvas{max-height:52vh}}
</style><main><div id="stage" class="stage"><canvas id="view" width="640" height="872" aria-label="橙橙动作过渡"></canvas></div><section><small>T计划 3.12 · 原素材连续播放</small><h1>动作之间，轻轻接上。</h1><p>走路、学习、看书与休息使用现有详细素材。切换时从眼前的姿势继续过渡，连续点击也能衔接。</p><nav id="choices"></nav><button id="auto">自动演示切换</button> <button id="pause">暂停</button><label><input id="slow" type="checkbox">慢速观察过渡</label><label><input id="dark" type="checkbox">深色背景</label><output id="status">正在加载现有素材…</output><small>此页面预览相邻帧与动作之间的混合衔接；桌面版另有实际位移、起步加速、到达前减速与计时联动。原图及 39 张 PNG 资源没有重绘。<br><a href="../../v3-desktop/桌宠流畅过渡-3.12.md">查看本次更新说明</a></small></section></main>
<script>
const view=document.querySelector('#view'),g=view.getContext('2d'),layers={},assets={},names=['idle','walk-left','walk-right','study','read','rest'],labels=['原图待机','向左走','向右走','学习','看书','休息'];
const off=()=>Object.assign(document.createElement('canvas'),{width:640,height:872}),pose=off(),display=off(),origin=off();let mode='idle',previous='idle',time=0,began=0,entry=0,last=0,progress=1,running=true,demo=false,nextDemo=0,loaded=false;
const ease=t=>{t=Math.min(1,Math.max(0,t));return t*t*(3-2*t)},duration=(a,b)=>a.startsWith('walk')||b.startsWith('walk')?240:360;
function copy(source,target){const c=target.getContext('2d');c.clearRect(0,0,640,872);c.drawImage(source,0,0);}
function mix(a,b,target,w){const c=target.getContext('2d');c.clearRect(0,0,640,872);c.globalCompositeOperation='source-over';c.globalAlpha=1-w;c.drawImage(a,0,0);c.globalCompositeOperation='lighter';c.globalAlpha=w;c.drawImage(b,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';}
function choose(value){if(!loaded||mode===value)return;copy(display,origin);previous=mode;mode=value;began=time;entry=time;progress=0;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));}
function sequence(){if(mode==='idle')return [0,0,0];const elapsed=Math.max(0,time-entry);if(mode.startsWith('walk')){const v=elapsed/(1000*.34/.36)*8;return [Math.floor(v)%8,(Math.floor(v)+1)%8,ease(v%1)];}const d=mode==='study'?[850,220,500,220]:mode==='read'?[2200,350,400,250]:[2000,500,1200,500];let t=elapsed%d.reduce((a,b)=>a+b,0);for(let i=0;i<4;i++){if(t<d[i]){const fade=Math.min(mode==='rest'?340:mode==='read'?240:170,d[i]*.8);return [i,(i+1)%4,ease((t-d[i]+fade)/fade)];}t-=d[i];}}
function render(){if(!loaded)return;const [a,b,w]=sequence();mix(layers[mode][a],layers[mode][b],pose,w);if(progress<1){progress=Math.min(1,(time-began)/duration(previous,mode));mix(origin,pose,display,ease(progress));}else copy(pose,display);g.clearRect(0,0,640,872);g.drawImage(display,0,0);document.querySelector('#status').textContent=labels[names.indexOf(mode)]+' · '+(progress<1?'过渡 '+Math.round(progress*100)+'%':'连续播放');window.previewState={mode,progress,time};}
function tick(now){if(last&&running)time+=Math.min(80,now-last)*(document.querySelector('#slow').checked ? .22 : 1);last=now;if(demo&&time>=nextDemo){choose(names[(names.indexOf(mode)+1)%names.length]);nextDemo=time+3500;}render();requestAnimationFrame(tick);}
for(let i=0;i<names.length;i++){const b=document.createElement('button');b.dataset.mode=names[i];b.className=i?'':'on';b.textContent=labels[i];b.onclick=()=>{demo=false;document.querySelector('#auto').textContent='自动演示切换';choose(names[i]);};document.querySelector('#choices').append(b);}
document.querySelector('#auto').onclick=e=>{demo=!demo;nextDemo=time;e.target.textContent=demo?'停止自动演示':'自动演示切换';};document.querySelector('#pause').onclick=e=>{running=!running;e.target.textContent=running?'暂停':'继续';};document.querySelector('#dark').onchange=e=>document.querySelector('#stage').classList.toggle('dark',e.target.checked);
(async()=>{for(const name of names){layers[name]=[];const count=name==='idle'?1:name.startsWith('walk')?8:4;for(let i=0;i<count;i++){const im=new Image();im.src='../../v3-desktop/companion-assets/'+(name==='idle'?'original':name.startsWith('walk')?name+'-'+String(i).padStart(2,'0'):'activity-'+name+'-'+String(i).padStart(2,'0'))+'.png';await im.decode();const layer=off(),c=layer.getContext('2d');if(name==='idle')c.drawImage(im,64,100,512,768);else c.drawImage(im,0,68);layers[name].push(layer);}}loaded=true;copy(layers.idle[0],display);requestAnimationFrame(tick);})().catch(()=>document.querySelector('#status').textContent='素材加载失败，请保留项目目录结构。');
</script></html>
